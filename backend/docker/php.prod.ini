; 生产 PHP 配置（只在 Dockerfile 的 prod target 里生效）。

; 源码烤进镜像且不可变，没有必要每次请求 stat 一遍文件。
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; opcache.preload 刻意**没有**开：预加载发生在 PHP 启动、也就是 entrypoint 预热之前，
; 那时 tmpfs 里还没有 config/preload.php 要 require 的容器编译产物。
; 详见 docker/entrypoint.sh 的说明。

; §7.4：禁用 X-Powered-By 版本回显。Caddy 侧还有一道 `header -Server`。
expose_php = Off

; 错误进 stderr（由 Docker 收走），绝不回显给客户端 —— §7.4 不暴露内部细节。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; 上传/请求体上限：一期不做图片（§1.3 OUT 清单），条码 payload 上限 1024 字节（§7.5），
; 留 2M 已经非常宽裕。
post_max_size = 2M
upload_max_filesize = 2M

; 默认 UTC，时区语义全部在应用层处理。
date.timezone = UTC
