# §9.2 的计划维护窗口（T-112）。
#
# ============================================================================
# 只配窗口的两头，三个下发字段全部派生
# ============================================================================
# `GET /v1/config` 的 `maintenance` 是 `{active, message_key, retry_after}`。
# 直接把这三个做成 env 是可以的，代价是运维要**手算**并维护它们之间的一致性：
# 窗口开始时把 `active` 翻成 true、同时维护一个递减的 `retry_after`、结束后三个
# 一起清掉。那是三次人工编辑，而漏掉最后一次的后果是横幅永远挂着。
#
# 这里只配两头，`Shared\Domain\Config\MaintenanceWindow::statusAt()` 按
# `ClockInterface` 派生出那三个字段。运维只做两件事：窗口定下来时填进去，
# 过期后清掉（不清也只是多一条过期配置，不会有任何公告）。
#
# 两头**必须成对出现**。只配一头直接 LogicException（→ 500）而不是宽容地当成
# 无窗口：漏填 end 的那次部署，运维以为公告发出去了而客户端什么也没收到，
# 这件事要等到维护窗口当天有用户投诉才会被发现。
#
# ============================================================================
# ⚠️ 格式：RFC 3339，offset 必填
# ============================================================================
#   MAINTENANCE_WINDOW_START="2026-09-15T03:00:00+02:00"
#   MAINTENANCE_WINDOW_END="2026-09-15T04:00:00+02:00"
#
# 不接受 `2026-09-15T03:00:00`。PHP 会按容器的 `date.timezone` 去解释它，于是
# **同一份配置在两个环境指向不同时刻** —— 而本地与 CI 通常都是 UTC，于是这个
# 故障只在生产显形，症状是「横幅早了/晚了两小时」，没人会把它和时区联系起来。
# 德国是 CET/CEST 两个 offset，夏令时切换当天还会再错一小时。
#
# ============================================================================
# 为什么是 env 而不是 Redis 或数据库
# ============================================================================
# Redis：本栈的 Redis 是单容器、无 AOF，§8.2 给它的定位是「限流计数保留 24 小时」。
# 一次重启就会把公告吃掉，而且 `/v1/config` 必须在 Redis 不可达时照样回答 ——
# 那就要再写一条降级路径，而降级到「没有公告」与「公告丢了」在外部看来一模一样。
#
# 数据库：要一张表、一次迁移、一个仓储，而 deptrac 里 `Shared.Http` 碰不到 Doctrine，
# 得再加一个反转端口（ADR-0018 那种形状）。对一个一期每周用一次的运维动作太大了。
#
# env 的代价是**公告一次 = 改 group_vars + 跑一次 Ansible（app 容器重建）**。
# 可以接受：§9.2 明说一期单主机部署、不承诺 HA，而公告本来就比窗口早 24 小时，
# 有充裕时间走一次正常部署。真要做到免重启，那是一张独立的卡，
# 而它的前置条件是先有一个不会丢数据的存储。
#
# ============================================================================
# 提前量为什么不在这里
# ============================================================================
# 24 小时是产品承诺（§9.2），写死在 `MaintenanceWindow::ANNOUNCEMENT_LEAD_SECONDS`。
# 做成 env 只会多一个能被配错、且配错了没人看得出来的值。
parameters:
    ncards.maintenance.window_start: '%env(MAINTENANCE_WINDOW_START)%'
    ncards.maintenance.window_end: '%env(MAINTENANCE_WINDOW_END)%'
