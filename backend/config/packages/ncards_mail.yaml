# §3.1 / §7.5 的「全局 · 邮件外发总量 · 阈值告警 + 熔断（保留 OTP）」（T-102）。
#
# ============================================================================
# 为什么不在 rate_limiter.yaml 里
# ============================================================================
# `tests/Unit/Shared/Infrastructure/RateLimit/RateLimitPolicyCoverageTest` 里
# 已经有一条显式豁免解释了这件事：
#
#   '全局邮件外发总量' => '§14.4 的阈值告警 + 熔断，不是 per-subject 限流'
#
# 三点区别：它没有 subject（RateLimiterInterface 的整个 API 都要一个键）；
# 超限的动作是**按信件分级丢弃**而不是返回 429；降级方向是 fail-open
# 而不是 fail-closed（见 MailCircuitBreaker 的类注释，那里解释了为什么
# 这个不对称与 §7.5 的取舍其实是一致的）。
#
# ============================================================================
# 两个数字怎么来的
# ============================================================================
# ⚠️ 先说结论：**现在这两个数字是保守猜测，不是实测值**，理由在本段末尾。
#
# §9.3 的目标是 12 个月 5 万注册。按最坏情况估当日发信量：
#
#   OTP / Magic Link  每个 DAU 每天最多 10 封（§7.5 的 email_hash 10/day 上限）
#                     但真实值远低于此 —— refresh 是 90 天滑动（§3.2 唯一保留的
#                     缓解措施），存量用户几乎不重新登录。按 DAU 的 5% 需要登录、
#                     人均 1.5 封估。
#   安全提醒          只在新设备登录与 refresh 重放时发，量级更小。
#
# 5 万注册、DAU 按 30% 算 = 15000，其中 5% 需要登录 = 750 人 × 1.5 = 约 1100 封/天。
#
# ============================================================================
# 为什么不是 3000 / 10000（Q3 定案改写了这两个数）
# ============================================================================
# 本文件初版按**专业 ESP** 估出 warn 3000 / breaker 10000（约 3 倍 / 9 倍余量）。
# 那个量级的前提是「通道本身没有硬上限，超发只是多花钱」。
#
# Q3 已决（ADR-0013）：发信走 n-cards.de 的**域名邮箱**（dogado），不是 ESP。
# 域名邮箱有**硬配额**，而且超了的后果不是计费，是**托管商限流或停用发信账号** ——
# 那是 R1（影响「致命」）的直接触发路径。于是这两个数字的性质变了：
#
#   ESP 时代：它是**告警**手段 —— 「今天不太对劲，看一眼」。
#   现在：    它是**保护**手段 —— 熔断必须发生在托管商动手之前。
#
# 因此下调到 warn 200 / breaker 500，方向刻意偏保守：宁可熔断误伤安全提醒
# （Advisory 被丢弃、记 result="suppressed"，OTP 与 Magic Link 照发），
# 也不能让发信账号被停掉 —— 前者是几封提醒信没发出去，后者是全站登不进去。
#
# ⛔ **这两个数是猜的。dogado 的实际配额还没查**（ADR-0013 的未解决项 b）。
# 查到之后按这个公式回来改，并把实测值记进 docs/runbooks/email-dns.md §4：
#
#     breaker ≈ 实测日配额 × 0.8      # 留出重投与 staging 的余量
#     warn    ≈ breaker × 0.4
#
# ⚠️ 若 dogado 是**每小时**配额，日阈值可能根本不是约束点（一次注册高峰能在
# 一小时内打满小时配额而日累计还很低）。真是那样就得给熔断器加一个小时维度的
# 计数键 —— MailVolumeCounterInterface 现在只有日粒度。把发现记回 ADR-0013。
#
# ⚠️⚠️ **顺带记一条 §9.3 层面的事实**：上面推算的约 1100 封/天，已经越过
# 典型域名邮箱的配额量级。也就是说这个通道**能撑住上线，撑不住 12 个月目标**。
# 判据（日累计持续 > 实测配额 50%）与处置（补做专业 ESP，2 人日，抽象层已就位）
# 在 email-dns.md §4。别等打满才动。
parameters:
    # 越过即记一行 error 日志。T-405 把它接进 Alertmanager（§14.4 的
    # 「邮件发送失败率」与「OTP 转化率骤降」两条 P1 告警在同一条链路上）。
    ncards.mail.daily_warn_threshold: 200

    # 越过即丢弃 Advisory 邮件（新设备登录提醒、refresh 重放提醒），
    # **保留** Critical（OTP、Magic Link）。分级的理由见 MailCriticality。
    ncards.mail.daily_breaker_threshold: 500
