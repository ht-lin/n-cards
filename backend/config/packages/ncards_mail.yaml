# §3.1 / §7.5 的「全局 · 邮件外发总量 · 阈值告警 + 熔断（保留 OTP）」（T-102）。
#
# ============================================================================
# 为什么不在 rate_limiter.yaml 里
# ============================================================================
# `tests/Unit/Shared/Infrastructure/RateLimit/RateLimitPolicyCoverageTest` 里
# 已经有一条显式豁免解释了这件事：
#
#   '全局邮件外发总量' => '§14.4 的阈值告警 + 熔断，不是 per-subject 限流'
#
# 三点区别：它没有 subject（RateLimiterInterface 的整个 API 都要一个键）；
# 超限的动作是**按信件分级丢弃**而不是返回 429；降级方向是 fail-open
# 而不是 fail-closed（见 MailCircuitBreaker 的类注释，那里解释了为什么
# 这个不对称与 §7.5 的取舍其实是一致的）。
#
# ============================================================================
# 两个数字怎么来的
# ============================================================================
# §9.3 的目标是 12 个月 5 万注册。按最坏情况估当日发信量：
#
#   OTP / Magic Link  每个 DAU 每天最多 10 封（§7.5 的 email_hash 10/day 上限）
#                     但真实值远低于此 —— refresh 是 90 天滑动（§3.2 唯一保留的
#                     缓解措施），存量用户几乎不重新登录。按 DAU 的 5% 需要登录、
#                     人均 1.5 封估。
#   安全提醒          只在新设备登录与 refresh 重放时发，量级更小。
#
# 5 万注册、DAU 按 30% 算 = 15000，其中 5% 需要登录 = 750 人 × 1.5 = 约 1100 封/天。
#
#   warn    3000   约 3 倍余量。越过它意味着「今天不太对劲」，值得看一眼，
#                  但还远没到会伤害域名声誉的量级。
#   breaker 10000  约 9 倍余量。到这里几乎一定是 bug（重发循环）或攻击，
#                  继续发下去是在拿发信域名冒险（R1，影响「致命」）。
#
# ⚠️ 这两个数字是**按一期规模**定的，不是普适值。上线后头一个月应该拿
# `email_send_total` 的实际值回来校准一次 —— 定得太低会让熔断误伤安全提醒，
# 定得太高则等于没有。校准这件事记在 T-405 的看板里。
parameters:
    # 越过即记一行 error 日志。T-405 把它接进 Alertmanager（§14.4 的
    # 「邮件发送失败率」与「OTP 转化率骤降」两条 P1 告警在同一条链路上）。
    ncards.mail.daily_warn_threshold: 3000

    # 越过即丢弃 Advisory 邮件（新设备登录提醒、refresh 重放提醒），
    # **保留** Critical（OTP、Magic Link）。分级的理由见 MailCriticality。
    ncards.mail.daily_breaker_threshold: 10000
