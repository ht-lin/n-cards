# §3.8 username 保留词黑名单（T-107，开放问题 Q9）。
#
# ============================================================================
# 为什么不在 ncards_limits.yaml 里
# ============================================================================
# 那个文件的抬头写明「本文件是**系统限额**：一个绝对的存量上限」。
# 一张词表不是限额 —— 它没有上限值、超了也不返回 `limit_exceeded`
#（保留词是 `422 username_invalid`）。
#
# username 的**数值**约束（3–20 字符、字符集、10 次总计）仍在 ncards_limits.yaml，
# 因为那三项确实是限额。两个文件里各留了一行交叉引用。
#
# ============================================================================
# 匹配语义：对归一化后的**完整值**精确匹配
# ============================================================================
# 强制点是 `Identity\Domain\ValueObject\UsernameRules::isReserved()`，
# 它拿到的已经是 `trim` + `strtolower` 之后的值，所以这里的词**必须**全部是
# 小写、且本身符合 `^[a-z0-9_]{3,20}$` —— 一个不合法的保留词永远匹配不到任何输入
#（值对象会先在字符集那一步把输入拒掉），等于白写。
# `UsernameRulesTest` 逐条断言这一点。
#
# ⚠️ **不做前缀 / 子串 / 变体匹配**，这是刻意的：
#   - 前缀拦截会误伤正常用户 —— `systematic_anna`、`information_anna`、
#     `roots_and_shoots` 都是合法的自选伪名，被拒的人无从理解原因；
#   - 变体拦截（`adm1n`、`_admin`、`admin_`）是一场没有终点的军备竞赛，
#     而它保护的东西本来就有限：username 是**伪名**，产品里没有「官方账号」
#     徽章或任何把 `admin` 渲染得更可信的 UI，冒充的收益远低于邮件钓鱼。
# 真正的防线是 §3.8 的「username 不含个人数据、且必须通过其他渠道从本人处获得」。
#
# ============================================================================
# ⚠️ Q9 仍是**未决项**（§17.5，决策人：产品，截止 M1 结束）
# ============================================================================
# 下面这份是技术负责人起草的清单，逐字取自任务卡 T-107 与 §3.8：
# 九个通用词 + 三个德语场景词。产品确认后改的就是这一个列表，代码不用动。
#
# 加词是**向后兼容的**（新名字被拒），删词也是。但注意加词**不会**回收已经
# 被占用的名字 —— 库里已有的行不受影响，那需要一次人工介入（§17.5 Q10 的口径）。
parameters:
    ncards.username.reserved_words:
        # §3.8「防冒充官方」列举的九个。
        - admin
        - support
        - ncards      # 品牌名的机器读形态（ADR-0002）。人读形态 `N-Cards` 含连字符，本就过不了字符集
        - help
        - root
        - system
        - info
        - kontakt
        - datenschutz
        # 任务卡 T-107（Q9）为德语场景补的三个。前两个对应 §8.6 要求的应用内法律页面
        # （Impressum / Datenschutz），第三个是德语里的「账户」，冒充客服话术最常用的词。
        - impressum
        - hilfe
        - konto
