# §8.2 ROPA 保留期的**执行点**参数（T-113）。
#
# ============================================================================
# 为什么单独一个文件
# ============================================================================
# 与 ncards_otp.yaml / ncards_limits.yaml 同一个理由：下面四个数字既不是 §7.5 的
# 「系统限额」（超了返回 422），也不是 §7.1 的「协议参数」（写进响应体给客户端），
# 而是**数据保留期** —— 它们的真相源是 §8.2 的 ROPA 表，改动要连着那张表一起改，
# 而不是跟着某个端点走。
#
# ⚠️ 改这里的任何一个数，都要同步改 docs/TECHNICAL_SPEC.md §8.2 那一行。
# 代码与 ROPA 不一致是**合规问题**，不是文档滞后：ROPA 是 Art. 30 要求的
# 书面记录，它写 30 天而代码留 90 天，那份记录就是假的。
parameters:
    # ------------------------------------------------------------------------
    # 僵尸注册行（§5.2「因此必须实现（MUST）」那一条）
    # ------------------------------------------------------------------------
    # `username IS NULL` 且超过这个天数的 users 行物删。
    #
    # 7 天的含义是「放弃注册」：ADR-0018 的 onboarding 拦截器让这类用户除了
    # GET /v1/me、POST /v1/me/username、POST /v1/auth/logout 之外什么都做不了，
    # 所以他们只是一条邮箱哈希 + 一个密文，没有任何关联业务数据。
    #
    # ⚠️ 调大它不是「更安全」：这些行携带 email_hash 与 email_encrypted，
    # 留得越久，§8.2 的「账号存续期」口径越站不住（他们根本没有账号）。
    ncards.cleanup.zombie_registration_days: 7

    # ------------------------------------------------------------------------
    # 死亡挑战的宽限期
    # ------------------------------------------------------------------------
    # 「死亡」= consumed_at 非空，或 expires_at 已过。满这个小时数才删。
    #
    # 为什么不是 0：留一天，排障时还能回答「昨晚那批登录失败是码错了还是过期了」。
    # 为什么不是 30 天：ADR-0014 之后这张表每行都带 email_encrypted（Vault Transit
    # 加密的收件邮箱），留存窗口就是 §8.2 那一行的「保留期」本身。24 小时是
    # 「够排障」与「PII 尽快消失」之间的取舍点。
    #
    # ⚠️ 调大它会让下面那条 30 天的 IP 兜底从「恒 0 行」变成真的有活干 ——
    # 那正是它存在的理由，见 ForgetOtpRequestIpsTask 的类注释。
    ncards.cleanup.otp_challenge_grace_hours: 24

    # ------------------------------------------------------------------------
    # request_ip_hash 的绝对上限（§8.2：「ip_hash 30 天」）
    # ------------------------------------------------------------------------
    # 超过这个天数的 otp_challenges 行，把 request_ip_hash 置空（**不删整行**）。
    #
    # ⚠️ 在当前配置下这条任务恒处理 0 行 —— 挑战 10 分钟过期、24 小时后整行就没了，
    # 活不到 30 天。它是**上限的强制点**，不是主力清理。完整论证见
    # App\Module\Identity\Application\Cleanup\ForgetOtpRequestIpsTask 的类注释。
    ncards.cleanup.request_ip_hash_days: 30

    # 上面那条任务单次最多处理多少行。
    #
    # 它逐条走实体（调 OtpChallenge::forgetRequestIp()）而不是批量 DQL，
    # 理由见那个任务的类注释。正常情况下一行都取不到，这个上限兜的是
    # 「有人把 grace 调到 30 天以上之后忘了这里」那种病态情况：
    # 宁可一次处理 1000 行、明天接着处理，也不要一次把几十万行拉进内存。
    ncards.cleanup.request_ip_batch_size: 1000
