# §7.1「令牌」那张表的落地（T-104）。
#
# ============================================================================
# 为什么单独一个文件
# ============================================================================
# 与 ncards_otp.yaml 同一套论证：下面这几个数是**协议参数**，不是 §7.5 第一张表
# 那种「存量上限，超了返回 422 limit_exceeded」的系统限额，所以不进 ncards_limits.yaml。
#
# 与 ncards_otp.yaml 分开，是因为它们的生命周期不同：OTP 的四个数属于「登录挑战」
# 这一个流程，而令牌参数会被 T-105（refresh 轮换）、T-108（鉴权器）继续消费。
# 混在一个文件里，改 OTP 有效期的人会以为自己也在动令牌。
#
# ============================================================================
# 密钥本身**不在这里**
# ============================================================================
# 签名密钥（Ed25519）存 Vault KV，由 infra/vault/bootstrap.sh 在建栈时生成
# （§5.3 密钥清单第四行）。这里只有它的**路径**。
#
# 没有 JWT_SECRET 之类的环境变量，这是刻意的：一个进 .env 的签名密钥会同时出现在
# 宿主机磁盘、compose 的 environment、`docker inspect` 的输出与 Ansible 的 fact 里，
# 而 §7.4 的威胁模型把这几处都算在「主机被控」的爆炸半径内。
# 走 Vault 的代价是每 5 分钟一次 KV 读（见 key_cache_ttl_seconds），换来的是
# 密钥的读取要过 AppRole 认证、有审计日志、且能在不重启应用的情况下轮换。
parameters:
    # KV v2 里的**逻辑**路径，不含 `data/` 段 —— 读取侧
    # （VaultKvSigningKeyProvider）自己插那一段。
    #
    # ⚠️ 必须与 infra/vault/bootstrap.sh 的 JWT_KV_PATH 逐字相同。
    # 对不上的症状是「刚建的栈登录不了」，而 Vault 侧只会回一个 404。
    ncards.jwt.kv_path: 'ncards/jwt/current'

    # §7.1「Access | JWT，EdDSA (Ed25519) | 15 分钟」。
    #
    # 这个数同时是响应体里的 `expires_in`（契约 Session.expires_in 的示例就是 900）——
    # 但**不是**由控制器直接回填的：AccessTokenClaims::expiresInSeconds() 用
    # `exp - iat` 算，两者因此同源。分开的话，「配置改了、响应体没改」不会有测试红。
    #
    # 为什么这么短：§7.1 明确「服务端**不**做 access token 黑名单」——
    # 会话撤销后 refresh 立刻失效，但已签发的 access token 会一直有效到过期。
    # 15 分钟就是那个「撤销之后攻击者还能用多久」的窗口。
    # 调大它等于按比例放大远程登出与账号删除的生效延迟。
    ncards.jwt.access_ttl_seconds: 900

    # §7.1「Refresh | 32 字节随机，不透明 | 90 天滑动」。90 × 86400。
    #
    # 「滑动」的落点在 T-105：每次轮换把 sessions.expires_at 顺延同样的时长。
    # 本任务只负责登录时的首次设定。
    #
    # ⚠️ 这个 90 天是 §3.2 里被点名的**唯一一条零成本缓解措施**：
    # 它把邮件通道故障的爆炸半径限制在「新设备登录 / 新注册」，存量用户不受影响。
    # 调小它就是在按比例扩大那次故障的影响面。
    ncards.jwt.refresh_ttl_seconds: 7776000

    # 签名密钥在进程内缓存多久。
    #
    # ⚠️ 必须**远小于** §5.3 的双密钥重叠期（24h）。等于或大于它的话，
    # 轮换后仍在用旧密钥签名的 worker 会一直签到重叠期结束，
    # 然后它签出的每一枚 token 才开始被验签方拒绝 —— 症状出现在轮换之后一天，
    # 没人会把两件事联系起来。取 5 分钟：轮换几乎即时生效，
    # 而稳态下每 5 分钟一次 KV 读的成本可以忽略（登录不是高频路径）。
    ncards.jwt.key_cache_ttl_seconds: 300
