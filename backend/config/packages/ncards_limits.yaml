# §7.5 系统限额（T-006）。
#
# ============================================================================
# 系统限额 ≠ 速率限制
# ============================================================================
# 本文件是**系统限额**：一个绝对的存量上限（「你最多有 500 张卡」），
# 超限返回 **422 `limit_exceeded`**。强制点是
# `App\Shared\Domain\Limit\LimitEnforcer`。
#
# **速率限制**是另一回事（「你每分钟最多请求 30 次」），超限返回
# **429 `rate_limited`**，配置在同目录的 `rate_limiter.yaml`。
# 两者的机制、状态码、降级方向都不同，不要混。§3.1 把它们混为一谈正是
# 那节 CTO 复审要修的问题。
#
# ============================================================================
# 为什么是配置而不是数据库
# ============================================================================
# ADR-11：一期完全免费，**不建 `plan` / `quota` 表**。但 §3.1 的修订同时要求
# 「必须在配置中硬编码系统限额常量，并在服务端强制校验」—— 免费不等于无限额，
# 无限额的免费产品是标准的 DoS / 垃圾邀请向量。
#
# 改这里的任何一个数字都要同步 §7.5 的表，并在 PR 里说明理由。
# `tests/Unit/Shared/Domain/Limit/LimitEnforcerTest` 逐项断言边界值。

parameters:
    # ---------------------------------------------------------------- 计数类
    # 远超真实使用（§7.5：P99 < 30）。
    #
    # ⚠️ 计数只统计 `owner_id = :user`：**共享卡不计入 viewer 的额度**（§17.5 Q11）。
    # 否则 owner 可以通过共享消耗他人配额 —— 那本身就是一种滥用面。
    # 强制点是 `CreateCardService::enforceLimits()`，计数口径落在
    # `DoctrineCardRepository::countOwnedBy()`（那条 DQL 不 join card_members）；
    # Q11 由 `tests/Integration/.../CardQuotaScopeTest` 在真库上钉住。
    ncards.limits.cards_per_user: 500

    # 1 owner + 19 viewer（§7.5）。家庭 / 小团体的量级。
    ncards.limits.members_per_card: 20

    ncards.limits.friends_per_user: 500

    # 防骚扰（§3.1：v1.1 取消邮箱邀请后，骚扰面转移到了好友请求上）。
    # 「每日」按 UTC 自然日计，强制点在 T-301。
    ncards.limits.friend_requests_per_day: 50

    # 同上，强制点在 M2 的共享邀请路径。
    ncards.limits.share_invites_per_day: 100

    # ---------------------------------------------------------------- 长度类
    # ⚠️⚠️ 单位不同，别抄错：
    #   payload 是**字节**（strlen）—— 它是 barcode 的原始载荷，可能含非 UTF-8 字节，
    #                                  按字符计会让一个合法的 1024 字节 PDF417 被拒；
    #   note / title 是**字符**（mb_strlen）—— 面向人类输入，德语变音符号
    #                                          按字节算会让「Müller」凭空多占一个额度。
    # LimitEnforcer 用 SystemLimit::unit() 把这个区分变成类型层面的东西，
    # 而不是靠每个调用点自己记得。

    # 覆盖 PDF417 / QR 的实际上限（§7.5）。
    ncards.limits.barcode_payload_bytes: 1024

    ncards.limits.note_chars: 2000
    ncards.limits.title_chars: 100

    # ---------------------------------------------------------------- username
    # §3.8 / §7.5：3–20 字符，`[a-z0-9_]`。
    #
    # ⚠️ 这三项**不经 LimitEnforcer 的 enforce\* 抛异常**，只作为常量暴露给 T-107。
    # 理由是错误码不同：username 不合规是 `422 username_invalid`（§6.1 有专门的 code），
    # 不是 `limit_exceeded`。把它塞进 limit_exceeded 会让客户端无法区分
    # 「名字格式不对，改一下」与「你的额度满了」。
    #
    # 正则**不带定界符**：调用方（T-107 的 Username 值对象）自己加，
    # 因为它同时要喂给 Android 侧做本地预校验（T-010），那边是 Kotlin 的 Regex。
    ncards.limits.username_min_chars: 3
    ncards.limits.username_max_chars: 20
    ncards.limits.username_pattern: '^[a-z0-9_]{3,20}$'

    # §7.5：`POST /v1/me/username` 按 user **10 次总计**（T-107）。
    #
    # ⚠️ 与上面三项**相反** —— 这一条走 `LimitEnforcer::enforceCanAdd()`，
    # 超了就是 `422 limit_exceeded`，所以它在 SystemLimit 枚举里有 case。
    # 区别在于它量的不是「名字长什么样」而是「你已经试了几次」，后者是存量。
    #
    # ⚠️ §7.5 把这一行印在**速率限制**表里，但它不是滑动窗口，也不返回 429：
    # 计数永不恢复（成功一次后端点永久 409），而契约强制 429 带 `Retry-After` ——
    # 只能编一个假秒数让客户端永远退避重试。完整论证见 ADR-0017。
    # 计数落在 `users.username_attempts` 列上，**不在 Redis**：§8.2 的 ROPA
    # 规定限流计数只留 24 小时，而这个计数要跨越账号生命周期
    #（同一条登记在 config/packages/rate_limiter.yaml 的页脚）。
    ncards.limits.username_attempts_per_user: 10

    # 保留词黑名单不在本文件 —— 词表不是限额，见 config/packages/ncards_username.yaml。
