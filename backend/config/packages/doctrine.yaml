# Doctrine —— DBAL（T-003）+ ORM（T-101）。
#
# T-003 只装了 DBAL：那时需要的只是一条能 `SELECT 1` 的连接，用来实现 §14.2 /
# T-003 验收标准里的 `/health/ready`（PG 不可用时 503）。实体映射、仓储与第一个
# 迁移属于 T-101，`orm:` 段是那时补上的。
#
# ⚠️ doctrine-bundle 锁在 **2.x**：3.x 起要求 PHP ^8.4，而本项目按 §12.2 跑 PHP 8.3
# （`composer.json` 的 `config.platform.php = 8.3.99`，CI 用 `php-version: '8.3'`）。
# 将来若把基线抬到 8.4，可一并升到 doctrine-bundle 3.x。
#
# ============================================================================
# 映射为什么是 XML 而不是 PHP 属性（T-101 / ADR-0011）
# ============================================================================
# `deptrac.yaml` 里每个模块的 Domain 层允许列表只有 `Shared.Domain` 一项 ——
# 没有任何 `Framework.*`。这就是 §12.2「Domain 不得 import 任何框架类型」的强制点。
# 而 `#[ORM\Entity]` 会 import `Doctrine\ORM\Mapping\*`，落进 `Framework.Persistence`
# 图层，于是属性映射在这个项目里**结构性地不可能**。
#
# 所以实体是纯 PHP（`Module/<M>/Domain/Entity/`），映射是 XML
# （`Module/<M>/Infrastructure/Doctrine/Mapping/`）—— 与 T-005 把
# `CryptoServiceInterface` 挪出 `Shared/Infrastructure` 是同一类结构性妥协。
#
# 新增一个模块的实体时，在下面的 `orm.mappings` 里复制一整块并改名。

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # 三个自定义类型，都是「让类型系统守住一列的语义」而不是便利糖：
        #
        #   uuid        T-004：Uuid 值对象 ↔ PG 原生 `uuid` 列（16 字节，索引友好；
        #               §9.3 假设 cards 表 75 万行，与 VARCHAR(36) 是实质差别）
        #   ciphertext  T-101：Ciphertext ↔ TEXT。挡住明文被写进 `*_encrypted` 列 ——
        #               库层分不出存进去的是密文还是明文，类型系统是唯一的闸门
        #   hash_digest T-101：HashDigest ↔ BYTEA。挡住 hex 被写进摘要列，
        #               并把「比较必须常量时间」（§7.1）收敛到 HashDigest::equals()
        #
        # `dbal.types` 走 doctrine-bundle 的 DBAL pass，与有没有 `orm:` 段无关。
        types:
            uuid: App\Shared\Infrastructure\Doctrine\UuidType
            ciphertext: App\Shared\Infrastructure\Doctrine\CiphertextType
            hash_digest: App\Shared\Infrastructure\Doctrine\HashDigestType

        # 反向工程时把 PG 的原生 `uuid` 映回我们的 UuidType，而不是 DBAL 内建的
        # `guid`（string）。
        #
        # ⚠️ 这里**只有 uuid 一条**，不要顺手加 `bytea: hash_digest` / `text: ciphertext`。
        # `doctrine:schema:validate` 的列比较走 `getColumnDeclarationSQL()` 的字符串
        # 相等（不是类型对象相等），内省出的 blob/text 与我们的类型生成的都是
        # `BYTEA` / `TEXT`，本来就对得上。真加了反而有害：将来一个存二进制附件的
        # BYTEA 列会被反向工程成「摘要」，一个存普通长文本的 TEXT 列会被当成密文。
        mapping_types:
            uuid: uuid

        # 显式钉死驱动与版本：DATABASE_URL 由容器环境变量注入（T-003）或 sops 下发
        # （T-012），不应该靠 query string 里的 serverVersion 来决定平台行为。
        driver: pdo_pgsql
        server_version: '16'
        charset: utf8

        # 嵌套事务用 SAVEPOINT 而不是「静默忽略内层」—— §4.2 唯一强制同事务的跨模块
        # 协作点（Social 解除好友 → Sharing 级联撤销）依赖嵌套事务语义正确。
        # 仓储的 save() 直接 flush，多写原子性靠 TransactionRunnerInterface 包一层，
        # 这条配置是那个做法能安全嵌套的前提。
        use_savepoints: true

        # ⚠️ T-102：把 `messenger_messages` 挡在 ORM 的视野之外。
        #
        # 那张表由 `email` transport 使用（config/packages/messenger.yaml），
        # DDL 在一个手写迁移里（DSN 带 `auto_setup=0`，因为 §13.5 / CONTRIBUTING §5
        # 要求所有 DDL 走迁移）。但它**没有** ORM 映射 —— 它不是领域实体。
        #
        # 不加这一行的话，`doctrine:schema:validate` 会把它当成「库里多出来、
        # 映射里没有」的表并报差异，`schema:update --dump-sql` 会给出一句
        # `DROP TABLE messenger_messages`。于是 `composer migration:check` 第三步
        # 直接红 —— 而 T-101 刚把「schema:validate 全绿 + dump-sql 报 Nothing to
        # update」立成了验收标准。
        #
        # 负向匹配（`(?!…)`）而不是列出想要的表：新增一张业务表时不用回来改这里，
        # 而漏改这里的症状恰恰是「schema:validate 说库里少了张表」——
        # 一个会被立刻发现、且指向正确的错误。
        #
        # ⚠️ 结尾**没有** `$`，是刻意的（实测踩过）。`id BIGSERIAL` 会连带建一个
        # `messenger_messages_id_seq` 序列，而 schema_filter 同样作用在序列上。
        # 写成 `~^(?!messenger_messages$)~` 的话表被滤掉、序列没有，于是
        # `schema:update --dump-sql` 会给出一句孤零零的
        # `DROP SEQUENCE messenger_messages_id_seq CASCADE` —— 真跑下去
        # 会 CASCADE 掉那张表的主键默认值，队列从此写不进去。
        schema_filter: '~^(?!messenger_messages)~'

        profiling_collect_backtrace: '%kernel.debug%'

    orm:
        # 不自动扫描 —— 每个模块的映射都要在下面显式登记。
        # 「加了实体但忘了登记」会在 `doctrine:mapping:info` 里立刻现形，
        # 而自动扫描会让它安静地变成一个不受管的普通类。
        auto_mapping: false

        # 关掉 doctrine-bundle 的控制器参数解析（EntityValueResolver）。
        # §12.2 分层职责表：`Http/Controller` 不得直接用 Doctrine。开着的话，
        # 一个 `public function show(User $user)` 就能让控制器直接查库，
        # 把 Application 层整个绕过去 —— 而 deptrac 拦不住它（那是框架在背后做的）。
        controller_resolver:
            auto_mapping: false

        # 按 XSD 校验映射文件。写错一个属性名（`nullable` 写成 `nullble`）时，
        # 不校验的话 Doctrine 会静默忽略它，于是那一列悄悄变成 NOT NULL，
        # 直到 schema:validate 或第一次插入才炸。
        validate_xml_mapping: true

        auto_generate_proxy_classes: '%kernel.debug%'

        # 报告字段声明在哪个类上（ORM 3 的默认行为，显式写出来免得升级时行为漂移）。
        report_fields_where_declared: true

        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Module/Identity/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Module\Identity\Domain\Entity'
                alias: Identity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" 由 ParaTest 注入；单进程跑时展开成空串，库名即 <db>_test。
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
