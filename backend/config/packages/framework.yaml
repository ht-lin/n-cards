# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # ---------------------------------------------------------------- T-004
    # ⚠️ 这两行修的是一个从 T-003 起就存在、但要到 T-006 才会显形的隐患。
    #
    # infra/caddy/Caddyfile 发 X-Forwarded-Proto，Caddy 还会自动加 X-Forwarded-For，
    # 但**没有 trusted_proxies 时 Symfony 两个都忽略**：
    #   - Request::getClientIp() 对每个请求都返回 Caddy 容器的 IP
    #   - Request::isSecure() 在 TLS 后面恒为 false
    #
    # T-004 立刻受影响：幂等键在没有认证用户时按 IP 分作用域，所有匿名客户端会
    # 挤进同一个桶。T-006 则是灾难性的 —— §7.5 的 `POST /auth/otp/request` IP 20/h
    # 与 `GET /v1/users/lookup` IP 100/h 会把全世界算作一个 IP，等于对登录端点的
    # 拒绝服务，而且看起来完全像是「限流生效了」。
    #
    # 回归测试：tests/Api/TrustedProxyTest。
    # ⚠️⚠️ 这个列表里**没有** x-forwarded-host，是刻意的。别「补全」它。
    #
    # 这三项就是 Symfony 自己的默认集（http-kernel/Kernel.php：FOR | PORT | PROTO）——
    # 上游把 HOST 排除在外是有理由的，我们不该比上游更宽松。
    #
    # 具体到本栈：Caddy 的 reverse_proxy 只在客户端**没发**时才补 X-Forwarded-Host
    # （X-Forwarded-For 是追加，X-Forwarded-Proto 被 Caddyfile 的 header_up 显式覆盖，
    # 只有 Host 是「有就不动」）。而 trusted_proxies: private_ranges 意味着 Caddy 容器
    # 受信 —— 于是外网客户端只要自己带上 `X-Forwarded-Host: evil.example`，
    # 就直接控制了 Request::getHost()：
    #   - 现在：该值被回显进框架 404 的 detail
    #   - T-006 之后：§7.1 邮件里的 Magic Link 会指向攻击者的域名
    #     （而绝对 URL 正是本节 trusted_proxies 存在的理由之一）
    #
    # 真需要按 Host 分支时，先配 framework.trusted_hosts 白名单，再谈信任这个 header。
    # 回归测试：tests/Api/TrustedProxyTest::testForwardedHostIsNotTrusted。
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
