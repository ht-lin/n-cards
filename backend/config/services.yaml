# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # ------------------------------------------------------------------ T-004
    # RFC 9457 `type` URI 的前缀（§6.1）。
    #
    # ⚠️ **在所有环境取同一个值**（生产值），staging 也不例外。
    # RFC 9457 把 `type` 首先当作**标识符**、其次才是可解引用的 URL。若它随环境变化，
    # 一个按 `type` 分支的客户端会在 staging 与 prod 上行为不同，而 Android 的
    # 集成测试还要为此准备两套 fixture。做成 env 只是为了 ADR-0002 的品牌名
    # （目前还是 Proposed）真定下来时能一处改掉。
    ncards.problem_type_base_uri: '%env(PROBLEM_TYPE_BASE_URI)%'

    # ------------------------------------------------------------ T-004 / T-112
    # §6.1 的强制升级基线：低于此版本的客户端一律 426 client_too_old。
    #
    # ⚠️ 两个读者，**同一个参数**：`ClientVersionListener` 做 426 判定，
    # `Shared\Application\Config\ClientConfigProvider` 把它下发给客户端
    # （`GET /v1/config` 的 `min_supported_client`）。拆成两个参数的话，漂了之后
    # 的症状是「客户端拿着服务端下发的最低版本，却仍然被拒」—— 而它没有任何办法
    # 判断是谁错了。`tests/Api/ConfigEndpointTest` 有一条专门钉这个同源性。
    ncards.min_supported_client: '%env(MIN_SUPPORTED_CLIENT)%'

    # 商店上最新的版本。消费者是**仍在支持范围内**的客户端 —— 用来做「有新版可用」
    # 这种软提示，不是强制墙（强制墙的信号是 426 本身）。
    #
    # 与上一行紧邻不是排版习惯：两者必须被**成对**读取。`ClientConfigProvider`
    # 在构造期断言 `latest >= min`，因为反过来的含义是「请升级到一个已经不被支持
    # 的版本」—— 客户端照做之后仍然是 426，而它会以为自己已经是最新的。
    ncards.latest_client: '%env(LATEST_CLIENT)%'

    # 超过这个大小的响应体不进幂等存储（只释放锁）。
    # php.prod.ini 的 post_max_size = 2M 本来就兜了底，这里是第二道。
    ncards.idempotency.max_body_bytes: 262144

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Shared 内核的两个「实现即注册」扩展点（T-003）。
    #
    # 新增一项就绪检查 / 一个模块的 seeder，只需实现对应接口 —— 不用回来改这里，
    # 也不用改 HealthController 或 SeedCommand。收集端分别是
    # App\Shared\Application\Health\ReadinessProbe 与
    # App\Shared\Infrastructure\Console\SeedCommand 的 #[AutowireIterator]。
    _instanceof:
        App\Shared\Application\Health\HealthCheckInterface:
            tags: ['app.health_check']
        App\Shared\Application\Seed\SeederInterface:
            tags: ['app.seeder']
        # ------------------------------------------------------------- T-113
        # 第三个「实现即注册」扩展点：每日清理任务（§8.2 保留期的执行点）。
        # 收集端是 App\Shared\Application\Cleanup\CleanupRunner 的 #[AutowireIterator]，
        # 两个调用方（scheduler 的消息与 `app:cleanup`）都经过它。
        #
        # 新增一条清理 = 加一个实现类。T-204（change_log 90 天）、T-402（导出过期）、
        # T-403（PurgeDeletedAccounts）、T-404（key rewrap）都照这条接进来 ——
        # 它们在 infra/compose 的 scheduler 槽位注释里已经点过名。
        App\Shared\Application\Cleanup\CleanupTaskInterface:
            tags: ['app.cleanup_task']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # ------------------------------------------------------------- T-101
        # Doctrine 实体不是服务。它们由 ORM 用反射实例化（不走构造函数），
        # 构造参数是 Uuid / HashDigest / Ciphertext 这类值对象，autowiring 无从解析。
        #
        # 现在不排除也「碰巧」不报错 —— 未被引用的私有服务定义会在
        # RemoveUnusedDefinitionsPass 里消失，autowiring 的错误是延迟抛的。
        # 但那是一条靠巧合成立的路径：哪天有人在别处 type-hint 了 `User`，
        # 容器会去尝试构造它，报出的错误会指向 services.yaml 而不是真正的原因。
        # 显式排除掉，让「实体不是服务」成为配置里写着的事实。
        exclude:
            - '../src/Module/*/Domain/Entity/'

    # ------------------------------------------------------------------ T-004
    # Shared 内核的接口 → 实现别名。
    #
    # Symfony 对「只有一个实现」的接口会自动建别名，所以下面这几条**目前**是冗余的。
    # 显式写出来有两个理由：
    #
    #   1. IdempotencyScopeResolverInterface 在 T-1xx 会有第二个实现
    #      （AuthenticatedIdempotencyScopeResolver）。第二个实现一出现，自动别名
    #      立刻消失，autowiring 会报一个指向 Shared 内核、但根因在 Identity 模块的
    #      费解错误。显式 alias 让那次替换变成改这里的一行。
    #   2. 「这个接口在生产里到底注进去的是哪个类」应该在配置里一眼可查，
    #      而不是靠推断容器的自动行为。
    App\Shared\Domain\Time\ClockInterface: '@App\Shared\Infrastructure\Time\SystemClock'
    App\Shared\Domain\Random\RandomnessInterface: '@App\Shared\Infrastructure\Random\SecureRandomness'
    App\Shared\Domain\Identity\UuidGeneratorInterface: '@App\Shared\Domain\Identity\Uuid7Generator'

    # 两条总线要注入的是**具名**的 Messenger bus，不是默认的那条 ——
    # 事件总线必须走 allow_no_handlers 的 event.bus（见 messenger.yaml），
    # 否则第一个还没有订阅者的领域事件会直接抛异常。
    App\Shared\Infrastructure\Messenger\MessengerCommandBus:
        arguments:
            $commandBus: '@command.bus'
    App\Shared\Infrastructure\Messenger\MessengerEventBus:
        arguments:
            $eventBus: '@event.bus'
    App\Shared\Application\Bus\CommandBusInterface: '@App\Shared\Infrastructure\Messenger\MessengerCommandBus'
    App\Shared\Application\Bus\EventBusInterface: '@App\Shared\Infrastructure\Messenger\MessengerEventBus'

    App\Shared\Application\Transaction\TransactionRunnerInterface: '@App\Shared\Infrastructure\Doctrine\TransactionalRunner'
    App\Shared\Application\Idempotency\IdempotencyStoreInterface: '@App\Shared\Infrastructure\Redis\RedisIdempotencyStore'

    # ------------------------------------------------------------------ T-005
    # 加密门面（§5.3）。三个接口在 Shared\Application\Crypto，实现在
    # Shared\Infrastructure\Crypto —— 这个分层是刻意的，理由见
    # CryptoServiceInterface 的类注释（照 §12.2 字面把接口放进 Infrastructure，
    # deptrac 会让任何模块都无法引用它）。
    App\Shared\Application\Crypto\CryptoServiceInterface: '@App\Shared\Infrastructure\Crypto\VaultTransitCrypto'
    App\Shared\Application\Crypto\BatchDecryptorInterface: '@App\Shared\Infrastructure\Crypto\VaultBatchDecryptor'
    App\Shared\Application\Crypto\HmacHasherInterface: '@App\Shared\Infrastructure\Crypto\VaultHmacHasher'

    # token provider 由工厂在**运行时**按环境变量挑：配了 VAULT_ROLE_ID 走 AppRole，
    # 否则走静态 VAULT_TOKEN。不用 `when@prod` —— staging 与 prod 的 APP_ENV 同为 prod，
    # 而判据本来就该是「有没有凭据」而不是环境名。详见工厂的类注释。
    App\Shared\Infrastructure\Vault\VaultTokenProviderInterface:
        factory: ['@App\Shared\Infrastructure\Vault\VaultTokenProviderFactory', 'create']

    # ✅ T-105 已接：认证过的请求按 `user:<uuid>` 隔离幂等键，其余回落到 IP。
    # 与下面的 RateLimitSubjectResolverInterface 是**同一个待办的两半**，
    # 当初就是这么写的注释，也确实是一起改的。
    App\Shared\Application\Idempotency\IdempotencyScopeResolverInterface: '@App\Shared\Infrastructure\Http\AuthenticatedIdempotencyScopeResolver'

    # ------------------------------------------------------------------ T-102
    # §14.4 指标的接缝。抓取端点与告警规则归 T-405 ——
    # 它要做的是加一个读同一批 Redis 键的导出器，调用点一行不动。
    App\Shared\Application\Metrics\MetricsInterface: '@App\Shared\Infrastructure\Metrics\RedisCounterMetrics'

    # ------------------------------------------------------------------ T-006
    # §7.5 速率限制（config/packages/rate_limiter.yaml）。
    App\Shared\Application\RateLimit\RateLimiterInterface: '@App\Shared\Infrastructure\RateLimit\RedisSlidingWindowRateLimiter'

    # ✅ T-105 已接：§7.5 的「全部写接口 user 300/min」从这一刻起真的按 user 生效。
    #
    # ⚠️ 免鉴权的端点上仍然回落到 IP 维度（那里没有 AuthContext），
    # 而那条回落依赖 framework.yaml 的 trusted_proxies ——
    # 没有它，getClientIp() 对每个请求都返回 Caddy 容器的 IP。
    # 回归测试 tests/Api/TrustedProxyTest。
    App\Shared\Application\RateLimit\RateLimitSubjectResolverInterface: '@App\Shared\Infrastructure\Http\AuthenticatedRateLimitSubjectResolver'

    # §7.5 系统限额（config/packages/ncards_limits.yaml）。
    #
    # ⚠️ 必须显式列参数：LimitEnforcer 在 Shared\Domain，而 deptrac 里
    # `Shared.Domain` 的允许列表是**空的** —— `#[Autowire]` 属于 Framework.Core，
    # 在那一层是 violation。类注释解释了为什么它非在 Domain 不可。
    #
    # 加一条限额 = 改三处：ncards_limits.yaml、SystemLimit 枚举、这里。
    # 漏掉第三处的话，容器会因为 LimitEnforcer 少一个构造参数而拒绝编译
    # （tests/Integration/ContainerCompilesTest 兜底），不会静默。
    App\Shared\Domain\Limit\LimitEnforcer:
        arguments:
            $cardsPerUser: '%ncards.limits.cards_per_user%'
            $membersPerCard: '%ncards.limits.members_per_card%'
            $friendsPerUser: '%ncards.limits.friends_per_user%'
            $friendRequestsPerDay: '%ncards.limits.friend_requests_per_day%'
            $shareInvitesPerDay: '%ncards.limits.share_invites_per_day%'
            $barcodePayloadBytes: '%ncards.limits.barcode_payload_bytes%'
            $noteChars: '%ncards.limits.note_chars%'
            $titleChars: '%ncards.limits.title_chars%'
            $usernameMinChars: '%ncards.limits.username_min_chars%'
            $usernameMaxChars: '%ncards.limits.username_max_chars%'
            $usernamePattern: '%ncards.limits.username_pattern%'
            # T-107。上面三个是 username 的**格式**常量（只读暴露，不抛异常），
            # 这一个相反：它有 SystemLimit case，走 enforceCanAdd() → 422 limit_exceeded。
            $usernameAttemptsPerUser: '%ncards.limits.username_attempts_per_user%'

    # ------------------------------------------------------------------ T-102
    # 邮件通道（§3.1 / §3.2 / §8.3）。
    #
    # 模块对外的唯一入口。别名显式写出来的理由与上面几条一样 ——
    # 「生产里注进去的到底是哪个类」应该在配置里一眼可查。
    App\Module\Notification\Application\Port\MailSenderInterface: '@App\Module\Notification\Infrastructure\Messenger\QueueingMailSender'
    App\Module\Notification\Application\Port\MailTransportInterface: '@App\Module\Notification\Infrastructure\Mail\SymfonyMailerTransport'
    App\Module\Notification\Application\Port\MailVolumeCounterInterface: '@App\Module\Notification\Infrastructure\Redis\RedisMailVolumeCounter'

    # ------------------------------------------------------------------ T-110
    # Sharing 的成员端口（§4.2 规则 2：跨模块同步调用只能经对方的 Port）。
    #
    # 三个接口**一个实现类**，所以 Symfony 的「单实现自动别名」在这里不成立
    # （它按接口 → 唯一实现类推断，而这个类实现三个接口时那条推断仍然可用，
    # 但反过来说：将来任何一个接口出现第二个实现，三条别名会一起失效）。
    # 显式写出来的理由与上面几条一样 —— 「生产里注进去的到底是哪个类」
    # 应该在配置里一眼可查，而这次答案对三个接口是同一个，更值得写明。
    App\Module\Sharing\Application\Port\CardOwnershipRegistrarInterface: '@App\Module\Sharing\Application\Membership\CardMembershipService'
    App\Module\Sharing\Application\Port\CardMembershipReaderInterface: '@App\Module\Sharing\Application\Membership\CardMembershipService'
    App\Module\Sharing\Application\Port\CardPlacementWriterInterface: '@App\Module\Sharing\Application\Membership\CardMembershipService'

    # 要注入的是**具名**的 mail.bus，不是默认的 command.bus ——
    # 后者恒同步（见 messenger.yaml），路由到异步 transport 会抛
    # 「Message was handled zero times」。
    App\Module\Notification\Infrastructure\Messenger\QueueingMailSender:
        arguments:
            $mailBus: '@mail.bus'

    # 序列化器装饰 Messenger 自带的 PhpSerializer。
    #
    # 装饰而不是自己编解码，是因为 Messenger 的 stamp（尤其是携带重投计数的
    # RedeliveryStamp）全都序列化在 body 里 —— 自己写会静默丢掉它们，
    # 症状是 `max_retries: 3` 永远达不到 3。完整论证见该类的注释。
    App\Module\Notification\Infrastructure\Messenger\EncryptedMailSerializer:
        arguments:
            $inner: '@messenger.transport.native_php_serializer'

    App\Module\Notification\Infrastructure\Mail\SymfonyMailerTransport:
        arguments:
            $fromAddress: '%env(MAIL_FROM_ADDRESS)%'
            $fromName: '%env(MAIL_FROM_NAME)%'

    # §3.1 的全局熔断。两个阈值的取值理由见 config/packages/ncards_mail.yaml。
    #
    # ⚠️ 必须显式列参数：#[Autowire] 属于 Framework.Core，而
    # `Notification.Application` 的允许列表里有它 —— 但把配置耦合进 Application
    # 层的类会让「改一个阈值」变成改代码。与 LimitEnforcer 同一个做法。
    App\Module\Notification\Application\MailCircuitBreaker:
        arguments:
            $warnThreshold: '%ncards.mail.daily_warn_threshold%'
            $breakerThreshold: '%ncards.mail.daily_breaker_threshold%'

    # `email` transport 的消费端。
    #
    # ⚠️ 用显式标签而不是 `#[AsMessageHandler]`：那个属性落在 deptrac 的
    # Framework.Messaging 图层，只对 *.Infrastructure 开放，写在 Application
    # 层是 violation。把 Handler 留在 Application 是为了让熔断判定与指标记录
    # 可单测、并计入 `Module/*/Application` 的 85% 覆盖率门槛。
    App\Module\Notification\Application\SendMailHandler:
        arguments:
            $provider: '%env(MAIL_PROVIDER)%'
        tags:
            - {name: messenger.message_handler, bus: mail.bus}

    # ------------------------------------------------------------------ T-103
    # §3.8 的恒定耗时预算。接口在 Shared\Application\Timing，实现用单调时钟
    # （不是 ClockInterface —— NTP 步进会让填充算错，见实现类的注释）。
    App\Shared\Application\Timing\TimeEqualizerInterface: '@App\Shared\Infrastructure\Timing\MonotonicTimeEqualizer'

    # §7.1 的 OTP 参数（config/packages/ncards_otp.yaml）。
    #
    # ⚠️ 显式列参数而不是在类里写 #[Autowire]：与 LimitEnforcer / MailCircuitBreaker
    # 同一个做法 —— 把配置耦合进 Application 层的类会让「改一个阈值」变成改代码，
    # 而这四个数字里有两个（resend_after 与 budget）是要按实测回调的。
    #
    # 这里**没有** max_attempts：那个参数归 T-104 的验证端点（见下面那条），
    # 请求侧不消费它。
    App\Module\Identity\Application\Otp\RequestOtpService:
        arguments:
            $codeDigits: '%ncards.otp.code_digits%'
            $ttlSeconds: '%ncards.otp.ttl_seconds%'
            $resendAfterSeconds: '%ncards.otp.resend_after_seconds%'
            $requestBudgetMillis: '%ncards.otp.request_budget_ms%'
            # T-106：信里 Magic Link 的前缀。指向**客户端**域（App Links），
            # 不是 API 域 —— 与 SessionIssuer / RefreshTokenService 同一个值。
            $appBaseUrl: '%env(APP_PUBLIC_BASE_URL)%'

    # ------------------------------------------------------------------ T-104
    # JWT 签发（§7.1：EdDSA / Ed25519，15 分钟）。
    #
    # 两个接口都在 Shared\Application、实现都在 Shared\Infrastructure ——
    # 与 CryptoServiceInterface / HmacHasherInterface 同一套摆法，理由见
    # CryptoServiceInterface 的类注释（没有任何模块能看见 Shared.Infrastructure）。
    App\Shared\Application\Token\SigningKeyProviderInterface: '@App\Shared\Infrastructure\Token\VaultKvSigningKeyProvider'
    App\Shared\Application\Token\AccessTokenSignerInterface: '@App\Shared\Infrastructure\Token\Ed25519AccessTokenSigner'

    # T-105：验签侧。签发与验签是两个类，共用同一个 SigningKeyProviderInterface
    # 的两个不同方法（`currentKey()` 签、`verificationKeys()` 验）——
    # 「验两把、签一把」的论证见那个接口的类注释。
    App\Shared\Application\Token\AccessTokenVerifierInterface: '@App\Shared\Infrastructure\Token\Ed25519AccessTokenVerifier'

    # 密钥本身在 Vault KV，这里只有路径与缓存 TTL（config/packages/ncards_jwt.yaml）。
    #
    # ⚠️ kvPath 必须与 infra/vault/bootstrap.sh 的 JWT_KV_PATH 逐字相同，
    # 且 infra/vault/policies/ncards-app.hcl 里要有对应的 read 授权 ——
    # 三处任何一处改了，另外两处一起改。对不上的症状是「刚建的栈登录不了」。
    #
    # previousKvPath 同样要在 policy 里有 read 授权，但**不由 bootstrap.sh 写入**：
    # 它只在 §5.3 的 24h 轮换重叠期里存在，由 T-404 的 runbook 建与删。
    App\Shared\Infrastructure\Token\VaultKvSigningKeyProvider:
        arguments:
            $kvPath: '%ncards.jwt.kv_path%'
            $previousKvPath: '%ncards.jwt.previous_kv_path%'
            $cacheTtlSeconds: '%ncards.jwt.key_cache_ttl_seconds%'

    # 验证端点的两个标量。`max_attempts` 从 T-103 起就配在 ncards_otp.yaml 里
    # 等着这一行 —— 它是 §7.5「challenge_id 5 次总计」的唯一强制点。
    #
    # ⚠️ 三个令牌相关的标量（access/refresh TTL、appBaseUrl）T-106 起归
    # SessionIssuer —— 本类只剩鉴别，签发那一半搬走了。
    App\Module\Identity\Application\Otp\VerifyOtpService:
        arguments:
            $maxAttempts: '%ncards.otp.max_attempts%'
            $verifyBudgetMillis: '%ncards.otp.verify_budget_ms%'

    # ------------------------------------------------------------------ T-106
    # 「挑战鉴别通过之后」的那一段，otp/verify 与 magic/consume 共用
    # （SessionIssuer 的类注释解释了为什么不能各写一份）。
    App\Module\Identity\Application\Session\SessionIssuer:
        arguments:
            $accessTtlSeconds: '%ncards.jwt.access_ttl_seconds%'
            $refreshTtlSeconds: '%ncards.jwt.refresh_ttl_seconds%'
            $appBaseUrl: '%env(APP_PUBLIC_BASE_URL)%'

    # ------------------------------------------------------------------ T-105
    # 刷新端点的三个标量。`refreshTtlSeconds` 在这里的用途与 T-104 不同：
    # 那边是**首次**设定 sessions.expires_at，这边是每次轮换**顺延**同样的时长 ——
    # 两者合起来才是 §7.1 的「90 天滑动」。同一个参数是刻意的，
    # 分成两个配置项会让「滑动窗口比初始窗口短」这种偏差没有任何测试会红。
    App\Module\Identity\Application\Session\RefreshTokenService:
        arguments:
            $accessTtlSeconds: '%ncards.jwt.access_ttl_seconds%'
            $refreshTtlSeconds: '%ncards.jwt.refresh_ttl_seconds%'
            $appBaseUrl: '%env(APP_PUBLIC_BASE_URL)%'

    # ------------------------------------------------------------------ T-107
    # username 的保留词黑名单（§3.8 / Q9，config/packages/ncards_username.yaml）。
    #
    # ⚠️ 必须显式列：UsernameRules 在 `Identity\Domain\ValueObject\`，而 deptrac 里
    # `Identity.Domain` 的允许列表只有 `Shared.Domain` —— `#[Autowire]` 属于
    # Framework.Core，在那一层是 violation。而数组参数 autowiring 也解析不了，
    # 两条理由指向同一个结论。与上面 LimitEnforcer 是同一个做法。
    #
    # ⚠️ 这个目录**不在** `App\` 的 exclude 里（那里只排除了 Domain/Entity/），
    # 所以 UsernameRules 会被自动注册成服务 —— 我们要的正是这个。
    # 同目录下的 Username 值对象构造是私有的，它的服务定义因为无人引用
    # 会在 RemoveUnusedDefinitionsPass 里消失，与 Shared\Domain\Crypto\HashDigest
    # 从 T-101 起的处境完全相同。
    #
    # 长度与正则**不在这里** —— 它们从 LimitEnforcer 转手（见 UsernameRules 的
    # 类注释：再接一遍参数会开出第二个真相来源）。
    App\Module\Identity\Domain\ValueObject\UsernameRules:
        arguments:
            $reservedWords: '%ncards.username.reserved_words%'

    # ------------------------------------------------------------------ T-113
    # `scheduler_default` 上唯一一条消息的消费端（§8.2 保留期的执行点）。
    #
    # ⚠️ 显式标签而不是 `#[AsMessageHandler]`：那个属性落在 deptrac 的
    # Framework.Messaging 图层，只对 *.Infrastructure 开放，写在 Application 层
    # 是 violation。与上面 Notification\Application\SendMailHandler 同一个做法，
    # 把 Handler 留在 Application 的理由也相同（要计入 85% 覆盖率门槛）。
    #
    # ⚠️ `bus: command.bus` **必须写出来**。`messenger:consume` 把没有 BusNameStamp
    # 的信封交给 RoutableMessageBus 的 fallback，而 fallback 就是 default_bus
    # （= command.bus，见 messenger.yaml）—— scheduler transport 产生的信封正是
    # 没有那个 stamp 的。不写 bus 的话 Handler 会注册到每一条总线上，
    # 而 event.bus / mail.bus 永远不会收到这条消息，纯属噪声。
    #
    # ⚠️ 这条**不进** messenger.yaml 的 routing 表：消息由 scheduler transport 在
    # worker 进程内产生并当场执行，配路由等于把它再发去另一条 transport。
    # 同理也**不要**在 messenger.yaml 里手写一条 `scheduler_default` transport ——
    # Symfony 的 AddScheduleMessengerPass 见到同名 receiver 就不再自动注册，
    # 手写的那条会把它顶掉。
    App\Shared\Application\Cleanup\RunDailyCleanupHandler:
        tags:
            - {name: messenger.message_handler, bus: command.bus}

    # §8.2 的保留期（config/packages/ncards_cleanup.yaml）。
    #
    # ⚠️ 显式列参数而不是在类里写 #[Autowire]：与 LimitEnforcer / MailCircuitBreaker /
    # RequestOtpService 同一个做法 —— 这三个数字的真相源是 §8.2 的 ROPA 表，
    # 把它们耦合进 Application 层的类会让「改一个保留期」变成改代码，
    # 而合规审查要改的恰恰是这几个数。
    App\Module\Identity\Application\Cleanup\PurgeZombieRegistrationsTask:
        arguments:
            $retentionDays: '%ncards.cleanup.zombie_registration_days%'

    App\Module\Identity\Application\Cleanup\PurgeDeadOtpChallengesTask:
        arguments:
            $graceHours: '%ncards.cleanup.otp_challenge_grace_hours%'

    App\Module\Identity\Application\Cleanup\ForgetOtpRequestIpsTask:
        arguments:
            $retentionDays: '%ncards.cleanup.request_ip_hash_days%'
            $batchSize: '%ncards.cleanup.request_ip_batch_size%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# ---------------------------------------------------------------------- T-004
# 仅 test 环境的 /v1 探针端点。
#
# T-004 交付的是横切层，本身不含任何 /v1 路由，但验收标准要求契约测试跑在真实
# HTTP 上。这个夹具提供那个 /v1 面。
#
# ⚠️ 原注释写的是「第一个真实端点 /v1/config 属 T-112」。那个判断过时了：
# auth（T-103/104）、me（T-108）、cards（T-109/110）都先于 T-112 落地。
# 夹具仍然留着 —— 幂等 / 限流 / problem+json / trusted proxy 的契约测试不该
# 依赖任何一个真实端点的业务前提（鉴权、onboarding、数据库里有行）。
#
# App\Tests\ 在 composer.json 的 autoload-dev 里；#[Route] 的 autoconfiguration
# 会打上 `routing.controller` 标签，由 config/routes.yaml 的
# `resource: routing.controllers` 收集 —— 与类所在目录无关（HealthController 的
# 类注释已经解释过这个机制）。
#
# dev/prod 容器里这段不生效，服务不存在，路由自然也不存在。
# tests/Api/RouteInventoryTest 会断言这一点。
when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        App\Tests\Fixture\:
            resource: '../tests/Fixture/'

        # ------------------------------------------------------------- T-103
        # 这里原本有一条 MailSenderInterface 的 `public: true` 别名（T-102 加的）。
        #
        # 它存在的理由是 T-102 那个 PR 里**没有任何生产调用方**：没人注入
        # MailSenderInterface，RemoveUnusedDefinitionsPass 就会把别名连同整条实现链
        # 一起删掉，QueuedMailPipelineTest 从容器 get() 会拿到 ServiceNotFoundException。
        # 当时的注释写着「T-103 落地后这几行可以删」。
        #
        # 现在 RequestOtpService 注入了它，服务不再是孤儿，测试容器
        # （test.service_container 能取到**未被移除**的私有服务）照样能 get() 到，
        # 于是那条别名如约删掉了。
