# NCards Android 版本目录 —— §12.3 的「唯一依赖声明处」。
#
# 规则（不是建议）：
#
#   1. 任何模块的 build.gradle.kts 里**不得**出现字面量版本号。所有坐标经 `libs.` 引用。
#   2. build-logic 也吃这份目录（build-logic/settings.gradle.kts 里 `from(files(...))`），
#      所以 convention plugin 里的依赖同样走这里，没有第二份真相源。
#   3. 只声明**已经在用**的东西。后续任务要用什么，由那个任务往这里加 ——
#      提前把 CameraX / ML Kit / Retrofit / SQLCipher 全摆上，只会得到一堆没人校对过、
#      半年后已经过期的版本号。各条的归属任务见下面的注释。
#
# 版本线（T-008 决策）：AGP 9.3.2 / Gradle 9.7.1 / Kotlin 2.4.10。
# AGP 9.3.2 的 Gradle module metadata 声明 org.gradle.jvm.version = 17，JDK 17 即可。

[versions]
# ---- 构建工具链 ----------------------------------------------------------
agp = "9.3.2"
kotlin = "2.4.10"
# KSP 从 2.3.0 起改为独立版本号（此前是 `<kotlin 版本>-<ksp 版本>` 的复合形态）。
# 写成 "2.4.10-x.y.z" 会解析不到。
ksp = "2.3.11"

# ---- SDK 级别（§4.3：minSdk 26 覆盖 ~98% 活跃设备且 Keystore/通知渠道可用） ----
#
# compileSdk 37.1 不是「追新」：本目录里 androidx.navigation 2.10 / androidx.hilt 1.4 /
# lifecycle 2.11 的 AAR 元数据都要求消费方 compileSdk ≥ 37，编译期直接拒绝 36。
# AGP 9 用 compileSdk + compileSdkMinor 两个值表达 Android 17 的 minor SDK。
#
# targetSdk 停在 36 是**另一件事**（AAR 那条错误信息也这么说）：compileSdk 决定
# 能用哪些 API，targetSdk 决定 opt-in 哪些运行时行为变更。上架前由 T-456 按
# 届时的 Play 要求决定要不要动它，不要在骨架期顺手拉齐。
compileSdk = "37"
compileSdkMinor = "1"
targetSdk = "36"
minSdk = "26"

# ---- 质量门禁（§13.3） ---------------------------------------------------
ktlint = "14.2.0"          # org.jlleitschuh.gradle.ktlint 插件版本
ktlintCli = "1.8.0"        # 插件驱动的 ktlint 引擎版本，单独钉住
detekt = "1.23.8"
kover = "0.9.9"

# ---- AndroidX / Compose --------------------------------------------------
androidxCore = "1.19.0"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxNavigation = "2.10.0"
composeBom = "2026.08.00"

# ---- DI / 持久化 / 序列化 ------------------------------------------------
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.4"             # ncards.android.room 用；建表是 T-009
# SQLCipher（§3.4：本地库必须加密）。**必须**是 net.zetetic:sqlcipher-android，
# 不是那个同名的老 artifact net.zetetic:android-database-sqlcipher ——
# 后者已停止维护，且初始化 API 完全不同（loadLibs(context) vs. System.loadLibrary）。
#
# 4.9.0 的两条选型依据：
#   ① 16 KB page size 对齐（4.6.1 起）。Play 对 targetSdk ≥ 35 的应用要求原生库
#      按 16 KB 对齐，不满足的包会被拒 —— T-456 上架时才发现就晚了。
#   ② 它只声明 androidx.sqlite:sqlite 2.2.0，而 Room 2.8.4 要 2.6.x；
#      Gradle 取高版本，SupportSQLiteOpenHelper 的接口在两者间未变。
sqlcipher = "4.9.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"

# ---- 网络（§4.3 的选型：Retrofit + OkHttp + kotlinx.serialization）--------
#
# 这三个版本**不是自由选择**，是 openapi-generator 产物的约束（T-010）：
# 7.25.0 的 `kotlin` 生成器 + `jvm-retrofit2` 库生成的代码 import 的就是
# Retrofit 3 与 OkHttp 5（它自己吐的 build.gradle 里写着 retrofitVersion = '3.0.0'）。
# 换大版本前先跑一次生成，看产物还编不编得过。
okhttp = "5.5.0"        # 用 BOM 统一 okhttp / logging-interceptor / mockwebserver3
retrofit = "3.0.0"      # 3.0 起 converter-kotlinx-serialization 是 Square 官方 artifact

# build-logic 里读 docs/api/openapi.yaml、剥掉 additionalProperties 再写成生成器输入
# 的那一步用（T-010，见 NcardsOpenApiPlugin）。它**只**活在构建里，不进任何 APK。
jackson = "2.22.2"

# openapi-generator 本身（T-010）。**必须钉死**：
# core/network/api/templates/ 下那份 data_class.mustache 是从**这个版本**的 jar 里
# 取出来改一行的（理由见该目录的 README）。升版本 = 重新取模板、重做那处改动、
# 重新生成并 review diff。不要顺手 bump。
openapiGenerator = "7.25.0"

# ---- 日志（§7.3：release 构建不得输出任何日志） --------------------------
timber = "5.0.1"

# ---- 测试（§13.4） -------------------------------------------------------
junit = "6.1.3"            # JUnit 5 / Jupiter
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.16.1"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxBenchmark = "1.5.0-rc02"
androidxUiAutomator = "2.4.0"

[libraries]
# ---- build-logic 的 compileOnly 依赖 -------------------------------------
# convention plugin 要在编译期看到这些插件的 DSL 类型。runtime 由各模块
# 通过 plugins {} 真正引入，所以这里是 compileOnly。
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
# ⚠️ 这两条是 build-logic 里**唯一**的 `implementation` 依赖，不是 compileOnly ——
# 上面那些是插件，运行期由消费方提供；Jackson 没人提供，ncards.openapi 自己要用。
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

# ---- AndroidX 基础 -------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
# collectAsStateWithLifecycle —— §4.3 的分层图里 UI 消费 ViewModel 的唯一方式
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }

# ---- Compose（版本由 BOM 统一，条目本身不带版本） ------------------------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

# ---- DI ------------------------------------------------------------------
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }

# ---- 持久化（ncards.android.room 用，建表是 T-009） ----------------------
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# 只给 core:database。别的模块要读数据就去用 data:* 的 Repository（§12.3）。
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

# ---- Kotlin 生态 ---------------------------------------------------------
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# ---- 网络（T-010） -------------------------------------------------------
# BOM 统一 okhttp 家族的版本，所以下面三条**故意不带** version.ref ——
# 带了就绕过 BOM，等于又有了第二个真相源。
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
# 只给 debug 变体用（§7.3：release 构建不得输出任何日志）。
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor" }
# mockwebserver3（**不是** okhttp3.mockwebserver 那个旧包）。生命周期由测试自己
# 用 @BeforeEach / @AfterEach 管 —— 官方还有个 mockwebserver3-junit5 扩展，
# 但为省下的三行代码多一个依赖不划算，而且它的 @StartStop 语义还在动。
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
# 只被 build-logic 的 ncards.openapi 当 JavaExec 的 classpath 用，不进任何 APK。
openapi-generator-cli = { module = "org.openapitools:openapi-generator-cli", version.ref = "openapiGenerator" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# ---- 测试 ----------------------------------------------------------------
# JUnit 5 用于**单元测试**（testOptions.unitTests.all { useJUnitPlatform() }）。
# 仪器测试仍是 JUnit 4 + AndroidX Test —— 见 ncards.android.library 的注释。
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiAutomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
# ⚠️ 刻意没有 org.jetbrains.kotlin.android：AGP 9 自带 Kotlin 支持，应用它会被拒绝。
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
