# NCards Android 构建属性。

# 30 个模块的并行配置期需要堆。-Xmx4g 是在 16 GB 开发机上实测过的下限；
# CI runner（7 GB）上够用，再高会和 Kotlin daemon 抢内存。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存在骨架期就打开，而不是等模块多了再补 —— 后者意味着要一次性修 30 个模块的
# 配置期违规。convention plugin 全部写成配置缓存兼容的形态（不在任务里引用 Project）。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true

# 非传递 R class：每个模块只看得到自己声明的资源，看不到依赖的。
# 这是「模块边界」在资源维度上的等价物，与 ModuleGraph.kt 是一套的。
android.nonTransitiveRClass=true

kotlin.code.style=official
