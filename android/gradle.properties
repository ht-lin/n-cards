# N-Cards Android 构建属性。

# 30 个模块的并行配置期需要堆。-Xmx4g 是在 16 GB 开发机上实测过的下限；
# CI runner（7 GB）上够用，再高会和 Kotlin daemon 抢内存。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存在骨架期就打开，而不是等模块多了再补 —— 后者意味着要一次性修 30 个模块的
# 配置期违规。convention plugin 全部写成配置缓存兼容的形态（不在任务里引用 Project）。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true

# 非传递 R class：每个模块只看得到自己声明的资源，看不到依赖的。
# 这是「模块边界」在资源维度上的等价物，与 ModuleGraph.kt 是一套的。
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle Managed Device 允许 API ≤ 26（T-011）。
#
# AGP 默认拒绝为 API 26 及以下创建 GMD 任务，报错原文：
#   "API level 26 and lower is currently not supported for Gradle Managed devices."
# 而 §14.3 逐字点名 **api 26 + api 34** 两档，§13.8 又把「Android 8 + 2 GB RAM 的
# 低端设备」写进了 Definition of Done —— 26 正是 minSdk，也正是最可能出问题的那一档。
# 把它从矩阵里拿掉等于把这条要求悄悄降级成「在新系统上能跑」。
#
# AGP 说的 "not recommended" 指的是旧镜像更慢、更容易 flaky，不是不能用。
# 真出现 26 专有的 flaky，出路是记录成已知事项并给出结论，不是删掉这一档 ——
# 见 build-logic 的 ManagedDevices.kt。
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true

# 一次只跑一台模拟器（T-011）。
#
# 默认会并发跑 api26 与 api34。实测在 16 GB 的机器上，两台模拟器叠加 Gradle 的
# -Xmx4g 会把内存吃光，**Gradle daemon 直接被杀**（报错是
# "Gradle build daemon disappeared unexpectedly"，完全不提内存 —— 别在那条信息上
# 浪费时间）。GitHub 的标准 runner 也是 16 GB，同一个坑。
#
# 代价是仪器测试的墙钟时间翻倍。它只在 main 合入流水线里跑（§14.3），不吃
# PR 的 12 分钟预算，所以这个代价是可以付的。
android.experimental.testOptions.managedDevices.maxConcurrentDevices=1
