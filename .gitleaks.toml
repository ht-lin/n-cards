# gitleaks 配置（§13.3 的「通用」表第一行：Secret 扫描 0 命中）。
#
# 扫描范围由 scripts/ci/check-gitleaks.sh 决定：**只扫 git 跟踪的文件**。
# 不这么做的话 `gitleaks dir .` 会连 node_modules / vendor / build / var 一起扫 ——
# 实测 757 条命中，其中 744 条来自这些目录，而它们一个字节都不入库。
# 淹在噪声里的门禁等于没有门禁。
#
# ⚠️ **加豁免前先想清楚。** 这张表和 build-logic 的 COVERAGE_EXEMPT、
# deptrac.yaml 的 Sync 只读豁免是同一类东西：每一条都必须写清为什么，
# 否则它会变成绕开门禁的后门。默认规则集里的 generic-api-key 本来就偏宽，
# 「反正它老误报」是最容易滑坡的一句话。

title = "N-Cards"

[extend]
# gitleaks 自带的规则集全量启用，本仓库不加自定义规则 —— 我们没有自研的凭据格式。
useDefault = true

# ---------------------------------------------------------------- 全局豁免

[[allowlists]]
description = """
契约与测试里的假 UUID。全仓统一用 0192f3a1-b2c3-7d4e-8f01-… 这个前缀造 UUIDv7
夹具（docs/api/openapi.yaml 的 example、core:network:impl 的测试常量），
generic-api-key 会把它当成高熵字符串。它是**约定好的假值**，换一个前缀
只会让下一个人再来加一条豁免。
"""
regexes = ['0192f3a1-b2c3-7d4e-8f01-[0-9a-f]{12}']

[[allowlists]]
description = """
本仓库的占位值命名约定：真实凭据绝不入库，入库的默认值一律以 dev-only- /
test-only- 开头（backend/.env、backend/.env.test、infra/compose/.env.example）。
名字本身就是它的文档 —— 一个叫 dev-only-not-a-secret 的值不需要再解释一遍。

Vault 的 dev 模式 root token 同理：它只存在于一次性的 service 容器与本地 compose 里，
生产走 AppRole（§7.4 / §17.4），unseal key 按 ADR-0004 离线保管、绝不进 CI。
"""
regexes = [
    '''(dev|test)-only-[a-z0-9-]+''',
]

# ---------------------------------------------------------------- 按文件豁免

[[allowlists]]
description = """
docs/api/openapi.yaml 里的 access_token / refresh_token / token 全部是 `example:`
的值 —— §13.1 第 2 条要求每个端点都有示例，Spectral 的自定义规则集在强制这一点。
这份文件按定义是**对外的接口描述**，它里面不存在「真实凭据」这个概念；真的有人
往契约里粘了一个真 token，那是 code review 该挡的事（§13.1 规定契约变更必须
双端同 PR，一定会被读到）。

只豁免 generic-api-key 这一条规则 —— AWS key、私钥块之类的强特征规则仍然生效。
"""
targetRules = ["generic-api-key"]
paths = ['^docs/api/openapi\.yaml$']

[[allowlists]]
description = """
自检脚本的夹具里**必须**有一个真·凭据形态的字符串 —— 它要断言的正是
「这样的东西会被拦下」。用 dev-only- 那种占位值做夹具等于什么都没断言
（占位值本来就在上面的豁免表里，脚本会绿得毫无意义）。

那个 AKIA… 是随手编的 20 字符，不对应任何账号。

只豁免 aws-access-token 一条规则、只在这一个文件里 —— 别的规则在这个文件里
照样生效，而 scripts/ci/check-todo-issue-refs.sh 里有一条形态相同的豁免
（同一个文件，同样的理由）。
"""
targetRules = ["aws-access-token"]
paths = ['^scripts/ci/sensitive-scan-selftest\.sh$']

[[allowlists]]
description = """
sops(age) 加密的 Ansible 变量文件（T-012）。**密文入库是刻意的** —— 那正是 sops
的用法，也是 §14.3「生产环境变量由 sops（age 密钥）加密后提交入库」的原文。

被拦的是密文本身：sops 的输出形态是 ENC[AES256_GCM,data:…,tag:…,type:str]，
一串高熵 base64，generic-api-key 见了就报。它不是凭据泄露 —— 没有对应的 age
私钥，这些字节什么也不是。私钥不在仓库里：staging 那把在 GitHub repository
secret SOPS_AGE_KEY，production 那把在 `production` Environment 的 environment
secret（两把是**不同**的密钥，见仓库根 .sops.yaml），都另有离线备份。

⚠️ 这条豁免**不是**「这个目录里的秘密不用管」。防「忘了加密就提交明文」的是
另一道门：scripts/ci/check-sops-encrypted.sh 断言这些文件的每个叶子值都以
ENC[ 开头，明文提交会在那里被拦下。两条断言写在
scripts/ci/sensitive-scan-selftest.sh 里，证明这个豁免没开成后门。

只豁免 generic-api-key 一条规则、只在这个路径下 —— AWS key、私钥块之类的
强特征规则在这些文件里照样生效。
"""
targetRules = ["generic-api-key"]
paths = ['^infra/ansible/inventory/group_vars/.*/secrets\.sops\.yaml$']

[[allowlists]]
description = """
VaultKvSigningKeyProvider 的单元测试夹具（T-104）。这个文件里有 4 处命中
private-key 规则：一把 Ed25519 私钥常量，外加 malformedPrivateKeys() 里三个
刻意拼坏的 PEM（不是 base64 / 长度差一个字节 / 算法 OID 不对）。

为什么夹具**必须**是一把真的 openssl 私钥：那组用例验的是「openssl genpkey
写出来的东西我们的解析器读不读得懂」—— infra/vault/bootstrap.sh 用的正是
genpkey。换成「固定前缀 + 任意 32 字节」拼出来的假 DER，断言就退化成
「我拼的东西符合我自己写的前缀常量」，等于什么都没测（文件头的类注释里
把这个论证写全了）。畸形 PEM 同理：要断言「这样的东西会被拒绝」，就得真的
把它写出来，和 sensitive-scan-selftest.sh 里那条 AKIA… 是同一个道理。

这把密钥只存在于本文件，不对应任何环境 —— 生产签名密钥在 Vault KV 里，
按 §7.4 / §17.4 由 AppRole 取，从来不入库；真 Vault 上的往返在
tests/Integration 里另有一条用例，不用这个夹具。

只豁免 private-key 一条规则、只在这一个文件里。
"""
targetRules = ["private-key"]
paths = ['^backend/tests/Unit/Shared/Infrastructure/Token/VaultKvSigningKeyProviderTest\.php$']
