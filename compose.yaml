# 仓库根的一键入口 —— 让 `docker compose up -d` 在仓库根就能起全栈。
#
# 真正的服务定义在 infra/compose/docker-compose.base.yml（§12.1 的目录约定）。
# 本文件只做两件事：
#   1. 把 compose 的 project directory 钉在仓库根，于是 `.env` 也在仓库根
#      （否则 project dir 会跟着 -f 指定的文件跑到 infra/compose/ 去）
#   2. include 进来，避免每次都敲一长串 -f
#
# staging / prod **不**走本文件 —— 那两个环境用显式的叠加链，见
# infra/compose/README.md 与 T-012 的 Ansible playbook。

name: ncards

include:
  - path: infra/compose/docker-compose.base.yml
    # 显式指定，免得 include 子项目的变量插值来源含糊。
    env_file: .env
