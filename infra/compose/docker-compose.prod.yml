# 生产覆盖层（§14.2）。**必须**叠在 base 之上，不能单独用：
#
#     docker compose -f infra/compose/docker-compose.base.yml \
#                    -f infra/compose/docker-compose.prod.yml up -d
#
# 由 T-012 的 Ansible playbook 下发与调用。真实的环境变量由 sops(age) 解密后
# 写成目标主机上的 `infra/compose/.env` —— **不入库**（§14）。
# 位置不能挪：compose 的 project directory 取 `-f` 第一个文件所在目录，
# .env 必须与 compose 文件同目录才会被自动加载，理由见 base 文件头部。
#
# ============================================================================
# 相对 base 的四处实质差异
# ============================================================================
# 1. app 用 prod target 且**不再绑定挂载源码** —— 代码来自镜像，镜像来自 GHCR。
# 2. caddy 开 443 + 自动 TLS（真实域名触发 ACME）。
# 3. vault 从 dev 模式换成 file 后端 + **人工 unseal**（Q6）。
# 4. 全部镜像 tag 收紧到补丁版本 —— 生产不接受 `:16-alpine` 这种会自己漂移的 tag。
#
# ⚠️ 每次部署后 vault **是封印状态**，必须人工 unseal（Shamir 3-of-5）才能提供服务。
# 这是刻意的（Q6：auto-unseal 关闭，unseal key 离线保管）。步骤见
# docs/runbooks/vault-unseal.md（T-005 交付）。app 在 vault 未 unseal 时
# /health/ready 会失败 —— 这正是期望行为，别为了「让健康检查绿」去开 auto-unseal。

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  app:
    build:
      context: ../../backend
      target: prod
    # T-012 的流水线把 GHCR 镜像 tag 写进 .env（tag 用 commit sha）。
    # 生产不在主机上现场构建 —— 部署的必须是 CI 验证过的那一个镜像。
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:latest}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0

      # T-005：生产走 AppRole，**不用** root token（§3.3 / §7.4 / §17.4）。
      #
      # 把 base 注入的 VAULT_TOKEN 显式清空 —— 叠加不会自动删掉 base 里的 key，
      # 留着的话 VaultTokenProviderFactory 仍然会挑 AppRole（判据是 VAULT_ROLE_ID
      # 非空），但一个能用的 root token 躺在生产容器的环境里本身就是个洞：
      # `docker inspect` 或任何一次 RCE 都能读到，而它没有 policy 限制。
      VAULT_TOKEN: ""
      # 两者由 sops(age) 解密后写进目标主机的 infra/compose/.env（T-012）。
      # ⚠️ VAULT_SECRET_ID 是凭据，绝不入库、绝不进 CI。
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID 未配置：生产必须走 AppRole，见 docs/runbooks/vault-unseal.md}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID 未配置：由 sops 下发，见 T-012}
    # 覆盖掉 base 的源码绑定挂载（`../../backend:/app:ro` 与 `../../docs:/docs:ro`）。
    #
    # ⚠️ **必须是 `!reset`，不能是 `volumes: []`。** compose 叠加时 volumes **不是**
    # 整体替换，而是**按 target 归并** —— 空列表没有任何一个 target，于是归并结果
    # 就是 base 那两条原样保留。目标主机上没有 backend/（sync.yml 刻意不同步），
    # Docker 会替你建一个空目录再以 :ro 盖在 /app 上，于是：
    #   - 镜像里的代码被一个空目录整个遮掉；
    #   - 紧接着 /app/var 那条 tmpfs 挂不上，因为挂载点要现建而 /app 是只读绑定，
    #     容器起不来：`make mountpoint "/app/var": read-only file system`。
    # `!reset` 是 Compose Spec 里专门用来「删掉 base 的这个键」的标签
    # （需要 compose ≥ 2.24；目标主机与 CI 上都远高于此）。
    volumes: !reset null
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # T-102：与 app 同镜像、同凭据口径，只是入口是 messenger:consume。
  #
  # 每一条覆盖都与上面 app 的那条对应且理由相同 —— 漏掉任意一条的后果也一样：
  #   image        生产不现场构建，部署 CI 验证过的那一个
  #   VAULT_TOKEN  清空，走 AppRole（root token 躺在生产环境变量里本身就是洞）
  #   volumes      !reset，否则镜像里的代码被一个空目录遮掉，容器起不来
  worker:
    build:
      context: ../../backend
      target: prod
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:latest}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      VAULT_TOKEN: ""
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?VAULT_ROLE_ID 未配置：生产必须走 AppRole，见 docs/runbooks/vault-unseal.md}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:?VAULT_SECRET_ID 未配置：由 sops 下发，见 T-012}

      # ⚠️ 生产**必须**配真实 DSN —— `:?` 让它缺失时 compose 直接拒绝启动。
      # 没有这道闸的话会回落到 base 的 `null://null`，于是「邮件全部静默丢弃」
      # 表现为「所有人都登不进去，但每一条日志都是绿的」。
      # DSN 含 SMTP 口令，是凭据：由 sops(age) 解密后写进目标主机的
      # infra/compose/.env（T-012），绝不入库、绝不进 CI。
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN 未配置：生产必须有真实发信通道，见 docs/runbooks/email-dns.md}
    volumes: !reset null
    deploy:
      # 2 副本。不是为了吞吐（§9.3 的量级一个就够），是为了**一个挂了还有一个** ——
      # worker 全挂的症状是「登录码不来」，而它不影响 /health/ready，
      # 在 T-405 的队列积压告警接上之前，冗余是唯一的缓解。
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # T-113：与 app / worker 同镜像、同凭据口径，入口是 messenger:consume scheduler_default。
  #
  # ⚠️ 这里**没有** VAULT_TOKEN: "" 那一行，不是漏了：base 的 scheduler 块压根
  # 不传任何 VAULT_*（清理任务不做加解密），所以没有 dev 值需要中和。
  # 上面 app / worker 那两行存在，是因为 base 给它们配了 dev root token。
  scheduler:
    build:
      context: ../../backend
      target: prod
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:latest}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    volumes: !reset null
    deploy:
      # ⚠️⚠️ **1，且必须是 1。** 紧邻的 worker 是 2 副本（一个挂了还有一个），
      # 这里正好相反：两个 scheduler = 同一条 cron 在同一分钟被触发两次。
      #
      # 后果不是数据损坏（三个任务都按截止时刻删，重跑删 0 行），而是
      # 两条并发 DELETE 互相等锁，加上 §14.4 的 cleanup_runs_total /
      # cleanup_rows_total 凭空翻倍 —— 而那两个计数器正是判断「清理有没有在跑」
      # 的依据，翻倍之后它们就不再说明任何事情。
      #
      # 多副本的正经解法是 Schedule::lock()（要装 symfony/lock 并配一个
      # framework.lock 资源）。没装，是因为「保证只有一个」在单主机 compose 上
      # 就是这一行，而 scheduler 挂掉的后果只是「今天的旧数据晚一天删」——
      # §8.2 的保留期是「不超过 N 天」，晚一天仍然满足，不需要冗余。
      #
      # 哪天真要 2 副本：**先装 symfony/lock 并给 Schedule 加 ->lock()**，
      # 别只改这个数字。
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:16.10-alpine
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    image: redis:7.4-alpine
    deploy:
      resources:
        limits:
          memory: 512M

  vault:
    image: hashicorp/vault:1.18.5
    # dev 模式的三个变量在这里显式清空 —— 叠加不会自动删掉 base 里的 key，
    # 留着的话 vault 会继续以 dev 模式起来（内存后端 + 自动 unseal），
    # 那等于把 §3.3 的整个加密威胁模型作废。
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_DEV_LISTEN_ADDRESS: ""
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    volumes:
      - ../vault/vault.hcl:/vault/config/vault.hcl:ro
      # §7.4：独立数据卷，与 app 不共卷。
      - vault_data:/vault/file
    healthcheck:
      # `vault status` 的退出码：0 = 已初始化且已解封，2 = 封印，1 = 连不上 / 出错。
      # ⚠️ **未初始化也是 2**（Initialized false + Sealed true，1.18 实测），不是 1 ——
      # 首启那一次（runbook 第 7 步）Vault 还没 init，靠的正是这一点才算健康、
      # 才让 `docker_compose_v2` 的 wait 通过。
      # 这里只要求「进程活着且能应答」（0 或 2 都算健康）—— 封印是等待人工
      # unseal 的正常中间态，不该让 compose 反复重启容器。
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200; [ $$? -ne 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # T-005：base 里的 vault-init 在生产**必须不跑**。
  #
  # profiles 让一个服务只在显式激活该 profile 时才启动，而没有任何生产命令会带
  # `--profile disabled` —— 这是叠加层「删掉一个服务」的唯一干净办法
  # （depends_on / environment 那种 key 合并在这里帮不上忙）。
  #
  # 为什么不能跑：
  #   1. 生产 Vault 每次重启都是**封印**状态。脚本探测到 503 会直接退出，
  #      于是每次 `docker compose up` 都多一个失败容器，纯噪声。
  #   2. 脚本需要 root 级 token。把那个 token 常驻在 compose 环境里，
  #      等于给 §17.4 那份最小权限清单开一个永久后门。
  #
  # 生产的正确做法是 unseal 之后**人工**跑一次，用一个用完即吊销的 root token：
  # 步骤见 docs/runbooks/vault-unseal.md。
  vault-init:
    profiles: ["disabled"]

# ============================================================================
