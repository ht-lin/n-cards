# N-Cards 本地全栈（§4.1 拓扑 / §14.2 服务清单 / T-003）。
#
# 这份文件**单独**就能跑起本地开发栈（在仓库根执行）：
#
#     cp infra/compose/.env.example infra/compose/.env
#     docker compose -f infra/compose/docker-compose.base.yml up -d
#
# staging / production 用叠加文件覆盖成生产形态（T-012 的 Ansible 这么调）：
#
#     docker compose -f infra/compose/docker-compose.base.yml \
#                    -f infra/compose/docker-compose.prod.yml up -d
#
# `.env` 与本文件同目录，是**刻意**的：compose 的 project directory 默认取 `-f` 的
# 第一个文件所在目录，所以上面两条命令自动读同一份 `infra/compose/.env`，
# 不需要 --env-file。若把 .env 放到别处（比如仓库根），本地那条能读到、叠加链却
# 读不到，而所有变量都写了 ${VAR:-default} 兜底 —— 于是它不会报错，只会静默用
# 默认值起来。那种失败最难查，别改回去。
#
# ============================================================================
# 三条不能改松的约束（§7.4，改动前先读）
# ============================================================================
# 1. postgres / redis / vault **没有 ports:**。只有 caddy 映射宿主机端口。
#    要在宿主机上连库，用 `docker compose exec postgres psql`，不要加端口映射。
# 2. app 容器非 root + read_only: true。可写点只有下面显式列出的 tmpfs。
# 3. vault 用**独立**数据卷，不与 app 共卷。
#
# ============================================================================
# 网络分层
# ============================================================================
# edge     caddy ↔ app。caddy 是唯一的入口。
# backing  app ↔ postgres/redis/vault。`internal: true` —— 这个网络连出站都没有，
#          三个后端服务不可能被误暴露，也不可能主动往外连。
#          §7.4 只要求「不映射宿主机端口」，internal 是顺手多加的一道。

name: ncards

services:
  # ---------------------------------------------------------------- caddy
  # §4.1：TLS 终结 + 反向代理 + 安全响应头。本地是明文 :80，
  # 真实域名与自动 TLS 在 .prod.yml / .staging.yml 里开。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- app
  app:
    build:
      context: ../../backend
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev-only-not-a-secret}
      # DATABASE_URL 在这里拼，而不是让 .env 里再写一份 —— 用户名/密码/库名
      # 只在 .env 里出现一次，改一处即可。
      DATABASE_URL: postgresql://${POSTGRES_USER:-ncards}:${POSTGRES_PASSWORD:-ncards}@postgres:5432/${POSTGRES_DB:-ncards}
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200

      # T-005：本地与 CI 用 dev 模式的 root token 直连 Vault。
      # 生产改用 AppRole（VAULT_ROLE_ID / VAULT_SECRET_ID，由 sops 下发，见 .prod.yml）——
      # root token 没有 policy 限制，等于把 §17.4 那份最小权限清单整个作废。
      # 选择逻辑在 Shared\Infrastructure\Vault\VaultTokenProviderFactory。
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}

      # T-004。没有这一行，Symfony 会忽略 caddy 发来的 X-Forwarded-For：
      # Request::getClientIp() 对每个请求都返回 caddy 容器的 IP，
      # 于是幂等键的 IP 维度失效，T-006 的 §7.5 按 IP 限流更会把全世界当成一个 IP。
      # `private_ranges` 覆盖本 compose 网络的网段。
      TRUSTED_PROXIES: private_ranges

    # §7.4：非 root（Dockerfile 里 USER ncards）+ 只读根文件系统。
    read_only: true
    security_opt:
      - no-new-privileges:true

    # 只读 rootfs 下唯一的两个可写点：
    #   /tmp      PHP 临时文件，以及 FrankenPHP 内嵌 Caddy 的 XDG 目录
    #   /app/var  Symfony 的 cache/ 与 log/
    #             （prod 环境下 Symfony **确实**会在运行时往 var/cache 写
    #              cache.app / cache.system 的文件池，不能设成只读）
    #
    # 挂在 /app/var 而不是分别挂 /app/var/cache 与 /app/var/log：后者要求这两个
    # 子目录在挂载点上**已经存在**，而 /app 是只读绑定挂载，Docker 建不出来，
    # 容器会起不来（`make mountpoint: read-only file system`）。
    # 两个子目录改由 docker/entrypoint.sh 在 tmpfs 里现场建，缓存也在那里预热 ——
    # tmpfs 每次容器启动都是空的。
    tmpfs:
      - /tmp:mode=1777
      - /app/var:uid=1000,gid=1000

    volumes:
      # 源码只读挂载：既保留本地改代码即生效，又不违反 read_only。
      # Symfony 只往 var/ 写，而 var/cache 与 var/log 是上面的 tmpfs。
      # 前置条件：先在 backend/ 跑过 `composer install`（见仓库根 README）。
      - ../../backend:/app:ro

      # 契约 schema。**只为跑测试**，运行时代码一行都不读 docs/。
      #
      # tests/Api/Support/ProblemDetailsAssertions 用 realpath 往上找
      # `docs/api/schemas/problem-details.schema.json`（T-004）。只挂 backend/ 的话
      # 那个路径在容器里落到 `/docs/...`，realpath 返回 false，于是
      # `docker compose exec app vendor/bin/phpunit` —— 仓库根 README 明确让人跑的
      # 那条命令 —— 会有 43 个 Api 用例失败，而裸机上跑同一套是全绿的。
      # 挂载点刻意选 /docs，与容器里的解析结果一致。
      - ../../docs:/docs:ro

    networks:
      - edge
      - backing

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ncards}
      POSTGRES_USER: ${POSTGRES_USER:-ncards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncards}
      # 本地库固定 UTF-8 + C collation，与 §5.2 的 citext/大小写归一化假设对齐。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # ⚠️ 没有 ports: —— §7.4。要连库用 `docker compose exec postgres psql -U ncards`。
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncards} -d ${POSTGRES_DB:-ncards}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- redis
  # §14.2：限流（T-006）、幂等键（T-004）、缓存。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly yes 是 §14.2 明确要求的：幂等键要活过一次重启，
    # 否则重启窗口内的重放会被当成新请求处理。
    command: ["redis-server", "--appendonly", "yes"]
    # ⚠️ 没有 ports: —— §7.4。
    volumes:
      - redis_data:/data
    networks:
      - backing
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- vault
  # 本地用 dev 模式（内存后端、自动 unseal、固定 root token）。
  # 生产形态在 .prod.yml：file 后端 + **人工 unseal**（Q6），见那里的注释。
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      # Vault 要 mlock 住内存，防止密钥被换页到磁盘。
      - IPC_LOCK
    # ⚠️ 没有 ports: —— §7.4。
    volumes:
      # §7.4 / T-003：Vault 用**独立**数据卷，绝不与 app 共卷。
      # dev 模式其实是内存后端，这个卷现在是空的 —— 声明它是为了让本地与
      # .prod.yml 的形态一致，T-005 初始化 Transit 引擎时不用再改结构。
      - vault_data:/vault/file
    networks:
      - backing
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- vault-init
  # T-005：一次性容器，跑 infra/vault/bootstrap.sh —— 启用 Transit、建三把 key、
  # 建 kv-v2 与 JWT 密钥、写两份 policy、配 AppRole。
  #
  # 为什么是一个服务而不是「起栈后自己敲一条命令」：根 README 承诺
  # `docker compose up -d` 一键起全栈，而一个没有 Transit 引擎的 Vault 会让
  # /health/ready 之外的一切涉密端点全部 503 —— 那不算「起来了」。
  #
  # 脚本是幂等的（每个创建动作前先探测存在性，且绝不覆盖已有密钥材料），
  # 所以每次 `up` 重跑一遍是安全的，`restart: "no"` 让它跑完就退出。
  #
  # ⚠️ **只在本地与 staging 用**。生产没有这个服务（见 docker-compose.prod.yml）：
  # 那里 Vault 每次重启都是封印状态，初始化是 unseal 之后的人工步骤，
  # 且需要一个用完即吊销的 root token —— 不该常驻在 compose 文件里。
  vault-init:
    # 自建镜像：脚本要 curl / jq / openssl，而 `backing` 是 internal: true
    # （连出站都没有），启动时装不了包 —— 只能构建期装好。见 infra/vault/Dockerfile。
    build:
      context: ../vault
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}
    volumes:
      # 只读挂载 infra/vault/ —— 脚本与 policies/ 都在里面，改一行策略不用重建镜像。
      - ../vault:/vault/bootstrap:ro
    networks:
      - backing

  # ---------------------------------------------------------------- worker
  # T-102：`email` 队列的消费端（§3.1 / §3.2）。
  #
  # 与 app 是**同一个镜像、同一份环境变量**，只是入口不同。分成两个服务而不是
  # 在 app 里起后台进程，是因为它们的失败模式与伸缩维度都不一样：
  # worker 挂了不影响 API 收请求（信只是堆在队列里），反过来也一样。
  #
  # ⚠️ 依赖 vault：消费一条消息 = 一次 transit/decrypt（消息体是加密的，见
  # backend/src/Module/Notification/Infrastructure/Messenger/EncryptedMailSerializer）。
  # Vault 封着时 worker 消费不了，但消息**留在队列里**，unseal 之后自然被消费掉。
  worker:
    build:
      context: ../../backend
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy

    # --time-limit=3600 让 worker 每小时自杀一次，由 restart 拉起。
    # 这是 Symfony 官方推荐的做法，防的是长驻 PHP 进程的内存增长与
    # Doctrine 连接老化 —— 不是「有 bug 才需要」，是长驻 PHP 的常态。
    #
    # ⚠️ 没有 --limit=N：那个是「处理 N 条后退出」，用在这里会让一个空闲的
    # worker 永远不退出、一个繁忙的 worker 频繁重启，正好反了。
    command:
      - bin/console
      - messenger:consume
      - email
      - --time-limit=3600
      - -v

    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev-only-not-a-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ncards}:${POSTGRES_PASSWORD:-ncards}@postgres:5432/${POSTGRES_DB:-ncards}
      REDIS_URL: redis://redis:6379
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}

      # T-102。本地默认 null://null（不发信）—— 想真看到信就起下面的
      # mailpit（dev profile）并把 .env 里的 MAILER_DSN 改成 smtp://mailpit:1025。
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@n-cards.de}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-N-Cards}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-unset}

    # 与 app 同一套加固（§7.4）。
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /app/var:uid=1000,gid=1000
    volumes:
      - ../../backend:/app:ro

    # ⚠️ 只连 backing，**不连 edge**。worker 不收 HTTP 请求，
    # 把它放进 edge 网络只会平白多一条从反向代理到它的路径。
    networks:
      - backing

    # ⚠️⚠️ 必须显式关掉，别删这三行。
    #
    # FrankenPHP 的基础镜像自带一条 `HEALTHCHECK curl -f http://localhost:2019/metrics`
    # （Caddy 的 admin 端点）。app 服务在下面自己覆盖了它，worker **没有** ——
    # 而 worker 根本不起 HTTP 服务器，那条检查必然失败。
    #
    # 后果不是崩溃循环（`restart: unless-stopped` 不因 unhealthy 重启），
    # 而是**一个永远显示 unhealthy 的容器**：`docker compose ps` 上的常驻红色会训练
    # 所有人忽略它，于是真出问题时那一格红色什么也不说明。
    #
    # 不换成「有意义的检查」是因为 worker 的存活性 docker 已经知道了：
    # `messenger:consume` 是 PID 1，它死了容器就退出，restart 立刻拉起。
    # 队列积压则是**业务指标**，归 §14.4 的 `outbox_messages_pending`（T-405），
    # 不该塞进容器健康检查 —— 队列长不等于 worker 坏了。
    healthcheck:
      disable: true

  # ---------------------------------------------------------------- mailpit
  # 本地看信用的 SMTP 收集器。**仅 dev profile**，`docker compose up` 默认不起：
  #
  #   docker compose --profile dev up -d mailpit    # UI: http://localhost:8025
  #
  # 然后把 infra/compose/.env 里的 MAILER_DSN 改成 smtp://mailpit:1025 并重启 worker。
  #
  # profile 而不是「只写在某个 override 文件里」：staging/prod 的叠加链会读
  # 同一份 base（见 infra/compose/README.md），没有 profile 的话这个容器会跟着上生产。
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # ⚠️ 只映射 UI（8025），**不映射 SMTP（1025）**：发信方是同一个 docker
      # 网络里的 worker，宿主机不需要能连上它。少开一个端口少一分风险。
      - "${MAILPIT_UI_PORT:-8025}:8025"

    # ⚠️⚠️ **两个网络都要**，少一个就不工作（实测踩过）：
    #   backing  worker 从这里连它的 1025（该网络 internal: true，无出站）
    #   edge     端口映射要走这里 —— internal 网络上的 `ports:` 会被静默忽略，
    #            症状是容器起得好好的、`docker compose ps` 里却没有 published port，
    #            浏览器打不开 8025 而没有任何错误信息。
    #
    # 这是本栈里唯一一个既要被内网服务访问、又要被宿主机访问的容器。
    # app 不算 —— 它的对外入口是 caddy，不是自己的端口映射。
    networks:
      - backing
      - edge

  # ==========================================================================
  # 尚未交付的服务（§14.2 的清单里有，但依赖还没装，写出来也起不来）
  # ==========================================================================
  # scheduler   入口 Symfony Scheduler：每日清理、删号执行、导出过期清理、key rewrap。
  #             T-113。
  # prometheus / grafana / loki / promtail / alertmanager
  #             §14.4 可观测性。T-405。
  # backup      wal-g / pgBackRest + age，cron 容器，推 Hetzner Storage Box。
  #             T-406（含一次真实恢复演练，§13.8 不可裁剪项）。

networks:
  edge:
    driver: bridge
  backing:
    driver: bridge
    # 无出站、无宿主机映射。
    internal: true

volumes:
  pg_data:
  redis_data:
  # §7.4：与 app 不共卷。
  vault_data:
  caddy_data:
  caddy_config:
