# staging 覆盖层（§14.1）。叠在 base **和** prod 之上 —— staging 的形态必须与
# 生产一致，否则它就证明不了任何东西：
#
#     docker compose -f infra/compose/docker-compose.base.yml \
#                    -f infra/compose/docker-compose.prod.yml \
#                    -f infra/compose/docker-compose.staging.yml up -d
#
# ⚠️⚠️ **staging 只用合成数据**（§14.1 / infra/README.md）。
# 严禁把生产数据复制过来，哪怕脱敏。需要真实规模的测试就用生成器造数。
# 这不是建议 —— 生产数据一旦落到 staging，GDPR 上的处理目的就变了。
#
# 相对 prod 的差异只有三处：域名、资源配额、日志级别。**没有**「staging 特有的
# 简化」—— 比如不会把 vault 换回 dev 模式，unseal 流程在 staging 上也要真跑一遍，
# 那正是 staging 的价值（§13.8：需要运维介入的事必须先有 runbook 并演练过）。

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:main}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      # 唯一放松的一处：staging 打 debug 级日志，方便复现问题。
      # 生产是 error 起。（monolog 由 T-405 接入，这个变量届时才生效。）
      LOG_LEVEL: debug
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # T-102。与 app 一样：只调 image / 日志级别 / 配额，形态不变。
  #
  # ⚠️ 副本数**不降到 1**。prod 是 2，staging 也是 2 —— 「worker 有多个副本」
  # 会暴露一类只在并发消费时才出现的问题（同一条消息被取两次、
  # Redis 计数器竞态），而那正是 staging 该替生产踩到的雷。
  #
  # ⚠️ staging 的 MAILER_DSN 同样是**真实**通道（由 sops 下发，见 T-012），
  # 不是 null://。§3.2 的验收标准是「向 Gmail / GMX / Web.de / Outlook 各发一封
  # 确认不进垃圾箱」，那 4 次手工验证要在 staging 上做 —— 收件人用团队自己的
  # 测试邮箱。发信域名与 SPF/DKIM/DMARC 记录见 docs/runbooks/email-dns.md。
  worker:
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:main}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      LOG_LEVEL: debug
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # T-113。与 app / worker 一样：只调 image / 日志级别 / 配额，形态不变。
  #
  # ⚠️ 副本数这里**确实**跟着 prod 保持 1，与上面 worker 的「不降到 1」正好相反。
  # worker 保持 2 是为了让 staging 替生产踩并发消费的雷；scheduler 的 1 不是
  # 配额选择而是**正确性约束**（两个副本会把同一条 cron 触发两次，见 prod 覆盖层），
  # staging 上同样必须成立 —— 何况 staging 的价值正在于形态与生产一致。
  scheduler:
    image: ${APP_IMAGE:-ghcr.io/ht-lin/n-cards-backend:main}
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      LOG_LEVEL: debug
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
