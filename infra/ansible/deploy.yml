---
# 可重复部署（T-012）。**每次 main 合入由 CI 调用**，也可人工跑。
#
#     cd infra/ansible
#     ansible-playbook -i inventory/staging.yml deploy.yml \
#       -e ncards_app_image=ghcr.io/ht-lin/n-cards-backend:<sha>
#
# 首启那一次（Vault 还没 init，/health/ready 必然 503）加两个开关：
#     -e ncards_wait_for_ready=false -e ncards_run_migrations=false
#
# 排练时若 ACME 用的是 Let's Encrypt staging 目录（证书不受公共信任）：
#     -e ncards_validate_certs=false
#
# 三条禁令（写在这里是因为改这个文件的人最容易犯）：
#   1. **绝不 `docker compose down`**，更绝不 `down -v` ——
#      后者会连 caddy_data（证书）、pg_data、vault_data 一起删。
#      Vault 数据卷没了 = 全部卡数据永久不可解密（§9.4）。
#   2. **绝不在主机上构建镜像。** 部署的必须是 CI 验证过的那一个。
#   3. **绝不把生产数据搬进 staging**，哪怕脱敏（§14.1）。

- name: 部署 N-Cards 栈
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: 校验镜像 tag 已指定
      ansible.builtin.assert:
        that:
          - ncards_app_image is defined
          - ncards_app_image | length > 0
          - "':' in ncards_app_image"
        fail_msg: >-
          ncards_app_image 必须是完整的 镜像:tag。
          例：-e ncards_app_image={{ ncards_image_repo }}:0123abc…

    # ------------------------------------------------------------------
    # 主流程。失败落到 rescue 去判断「该不该回滚」。
    # ------------------------------------------------------------------
    - name: 部署
      block:
        # ⚠️ `tags: always` 不是「这一步不可跳过」的意思，是让 `--tags` 能穿进去。
        # include_role 是**动态**包含：role 内部的 tag（preflight/env/…/health）
        # 直到运行时才被解析，而 `--tags health` 是在解析期过滤 play 的任务的 ——
        # 这个 include 自己没 tag，于是先被滤掉，role 根本没被打开，
        # 里面的 health 也就永远没机会匹配。表现是一个**空的 PLAY RECAP**
        # （一条任务都没跑过的主机不会出现在 recap 里），看起来像「跑完了、没事」。
        # 标 always 之后：include 总是被选中，role 内部的 tag 在运行时正常过滤，
        # `--tags health` / `--skip-tags snapshot` 都按预期工作。
        # 不用穷举 tag 列表，是因为那份列表会在 main.yml 加新 tag 时悄悄过期 ——
        # 而过期的表现正是上面那个「空 RECAP」，没有任何报错。
        - name: 执行部署流程
          ansible.builtin.include_role:
            name: ncards_stack
          tags: [always]

      rescue:
        # 走到这里说明某一步**抛错**了（拉不到镜像、compose 起不来、迁移失败…），
        # 而不是健康检查判定不好 —— 那种情况走下面的 post 判定。
        - name: 报告失败步骤
          ansible.builtin.debug:
            msg: >-
              部署在 “{{ ansible_failed_task.name }}” 失败：
              {{ ansible_failed_result.msg | default('见上面的输出') }}

        # 镜像还没换成功就失败的话（比如 pull 失败），现网还是好的，回滚反而多此一举。
        # 判据是 .env 里的 APP_IMAGE 是否已经是本次的目标。
        - name: 检查 .env 是否已被改成本次镜像
          ansible.builtin.shell:
            cmd: "grep -q '^APP_IMAGE={{ ncards_app_image }}$' {{ ncards_compose_dir }}/.env"
          register: ncards_env_switched
          changed_when: false
          failed_when: false

        # ⚠️ 第二个判据：主机上得真有「上一个镜像」可退。
        # 首次部署时 .env 必然已经是本次镜像（env.yml 在快照与起栈之前就渲染完了），
        # 于是上面那条判据一定成立，但根本没有可退回去的版本。少了这一条，
        # rollback.yml 的断言会以「没有可回滚的目标」再 fatal 一次，
        # 把真正的失败原因压在两层输出底下。
        - name: 读取可回滚的上一个镜像
          ansible.builtin.slurp:
            src: "{{ ncards_state_path }}/previous-image"
          register: ncards_previous_image_raw
          failed_when: false

        # 「可回滚」要同时满足：文件在、非空、且**不是本次这个镜像**。
        # 最后一条针对的是「同一个 tag 连续失败两次」：上一次失败留下的 .env 里
        # APP_IMAGE 已经是本次镜像，这一次的 deploy.yml 会照着它记 previous-image，
        # 于是回滚 = 把 app 重启成同一个镜像，撞同一个错，只是把真正的原因
        # 推到更下面一屏。（源头也堵了，见 roles/ncards_stack/tasks/deploy.yml。）
        - name: 判定是否有可回滚的目标
          ansible.builtin.set_fact:
            ncards_previous_image: >-
              {{ (ncards_previous_image_raw.content | default('') | b64decode | trim) }}

        - name: 回滚到上一个镜像
          ansible.builtin.include_role:
            name: ncards_stack
            tasks_from: rollback
          when:
            - ncards_env_switched.rc == 0
            - ncards_previous_image | length > 0
            - ncards_previous_image != ncards_app_image

        - name: 未触发回滚的说明（现网未被切走）
          ansible.builtin.debug:
            msg: >-
              .env 还没切到本次镜像（现网仍在跑上一个版本），不回滚。
              这是一次无损失败：修掉原因后直接重跑即可。
          when: ncards_env_switched.rc != 0

        - name: 未触发回滚的说明（没有可退的上一个版本）
          ansible.builtin.debug:
            msg: >-
              {% if ncards_previous_image | length == 0 %}
              {{ ncards_state_path }}/previous-image 不存在或是空的 ——
              这是这台机器上的第一次部署，没有可回滚的目标，不回滚。
              {% else %}
              previous-image 记的就是本次镜像（{{ ncards_app_image }}）——
              上一次部署也是它，且没跑起来过，回滚只会撞同一个错，不回滚。
              {% endif %}
              修掉上面报出的原因直接重跑即可（playbook 是幂等的）。排查见
              docs/runbooks/deploy-and-rollback.md 的「首次部署就失败了」一节。
          when:
            - ncards_env_switched.rc == 0
            - ncards_previous_image | length == 0 or ncards_previous_image == ncards_app_image

        - name: 部署失败
          ansible.builtin.fail:
            msg: >-
              部署失败。处置步骤见 docs/runbooks/deploy-and-rollback.md。

    # ------------------------------------------------------------------
    # 健康判定的处置。三种判定各有各的正确动作。
    # ------------------------------------------------------------------
    - name: 判定 ok —— 清理磁盘
      ansible.builtin.include_role:
        name: ncards_stack
        tasks_from: prune
      when: ncards_health_verdict == 'ok'

    # ⚠️ Vault 封印时**不回滚**。
    # 部署本身是成功的（/health/live 200），503 是 ADR-0004 的期望行为。
    # 回滚只会把好镜像换成旧的、然后仍然 503 —— 多制造一次噪声，
    # 而真正要做的是找三个人来 unseal。
    # job 仍然要红：staging 确实不可用，不该看起来像没事。
    - name: 判定 vault_sealed —— 不回滚，红着等人来 unseal
      ansible.builtin.fail:
        msg: |
          ::error title=VAULT_SEALED::部署本身成功（/health/live 200），但 Vault 处于封印或未初始化状态，
          /health/ready 返回 503。**这不是部署故障，回滚无用。**
          按 docs/runbooks/vault-unseal.md 人工 unseal（Shamir 3-of-5）。
          unseal 之后无需重新部署，/health/ready 会自己转 200。
      when: ncards_health_verdict == 'vault_sealed'

    - name: 判定 broken —— 回滚
      when: ncards_health_verdict == 'broken'
      block:
        - name: 回滚到上一个镜像
          ansible.builtin.include_role:
            name: ncards_stack
            tasks_from: rollback

        - name: 回滚后重新判定
          ansible.builtin.include_role:
            name: ncards_stack
            tasks_from: healthcheck

        - name: 部署失败（已回滚）
          ansible.builtin.fail:
            msg: >-
              健康检查判定 broken，已回滚到上一个镜像。
              回滚后的判定：{{ ncards_health_verdict }}。
              {% if ncards_health_verdict != 'ok' %}
              ⚠️ **回滚之后仍然不健康** —— 问题不在这次的镜像。
              立刻按 docs/runbooks/deploy-and-rollback.md 的「回滚也没救回来」一节处置。
              {% endif %}

    # ------------------------------------------------------------------
    # Vault policy 判定的处置（T-114）。
    # ------------------------------------------------------------------
    # ⚠️ 与紧邻的 VAULT_SEALED 同一条道理：**漂移不回滚**。
    # policy 跟这次的镜像没有任何关系，回滚只会把一个好镜像换成旧的、
    # 然后 policy 照样是漂的。所以判定留在角色里，处置放在这里 ——
    # 这也是它没写在 vault_policy.yml 里的原因（那里 fail 会掉进上面的 rescue，
    # 而 rescue 的下一步就是回滚）。
    #
    # ⚠️ `tags: always` 是必须的：runbook 里那条
    # `--tags vault-policy` 会把没有 tag 的 play 级任务全滤掉，于是漂移了也绿。
    # 带 always 之后，无论怎么过滤这条判定都在。
    # `default('ok')` 是给 `--tags health` 那种没跑过对账的场景兜底。
    - name: 判定 policy 漂移 —— 不回滚，红着等人处置
      ansible.builtin.fail:
        msg: |
          ::error title=VAULT_POLICY_DRIFT::policy 对账没通过。**这不是部署故障，回滚无用。**
          ⚠️ **先看上面那条「Vault policy 对账结果」到底有没有 diff** —— 这个判定是
          兜底桶：policy-sync.sh 只有 rc=0 算过、rc=3 算封印，**其余一律报到这里**，
          所以它红不等于真有漂移。
          处置见 docs/runbooks/deploy-and-rollback.md 的「情形 D」。常见的三种：
          ① 有人手工 `vault policy write` 放宽过（diff 里 Vault 那边多东西）；
          ② 改的是 ncards-policy.hcl 自己（那份按设计部署身份改不了，要一次 generate-root）；
          ③ **上面那条根本不是 diff** —— AppRole 登录失败（secret_id 粘错）、
          `no such service: vault-policy`（主机上的 compose 还是 T-114 之前的，
          补一次 `--tags sync,vault-policy`）、或 policies/ 挂空。这三种都与 Vault 里
          的 policy 无关，别照着 ①② 去处置。
      when: ncards_vault_policy_verdict | default('ok') == 'drift'
      tags: [always]
