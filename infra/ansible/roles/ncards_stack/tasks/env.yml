---
# 用 sops 解密出来的变量渲染目标主机上的 .env。
#
# 解密不在这里显式发生 —— ansible.cfg 启用了 community.sops 的 vars plugin，
# inventory/group_vars/<环境>/secrets.sops.yaml 在 playbook 启动时就已经被解开成
# 普通变量了。sops 从环境变量 SOPS_AGE_KEY 读私钥（CI 里由 job env 提供），
# 私钥**不落盘**。

- name: 校验凭据变量都已就位
  ansible.builtin.assert:
    that:
      - APP_SECRET is defined and APP_SECRET | length > 0
      - POSTGRES_PASSWORD is defined and POSTGRES_PASSWORD | length > 0
      - VAULT_ROLE_ID is defined and VAULT_ROLE_ID | length > 0
      - VAULT_SECRET_ID is defined and VAULT_SECRET_ID | length > 0
    fail_msg: >-
      secrets.sops.yaml 里的变量没读到。常见原因，按概率排：
        1. SOPS_AGE_KEY 没设，或设的是另一个环境的私钥（staging 与 production
           是两把不同的密钥，见仓库根 .sops.yaml）
        2. secrets.sops.yaml 还没创建 —— 从 secrets.sops.yaml.example 复制并
           `sops -e -i`，见 docs/runbooks/staging-first-boot.md 第 6 步
        3. community.sops collection 没装（ansible-galaxy collection install -r requirements.yml）
    # quiet: true —— 不打印通过的断言列表。
    #
    # ⚠️ 这里**刻意不加 no_log**。加了的话失败时整个结果会被替换成
    # "the output has been hidden due to the fact that 'no_log: true' was
    # specified for this result"，上面那段 fail_msg 一个字都看不到 ——
    # 等于用一道看不见的门换来零收益。而不加也不泄密：assert 失败时打印的是
    # `assertion`（表达式文本，只有变量**名**）与 `evaluated_to`，从不打印变量值。
    # （实测验证过两种写法的输出差异。）渲染 .env 那一步的 no_log 才是必须的 ——
    # template 模块在 diff 模式下会把渲染结果整个打出来。
    quiet: true

# ⚠️ 上一道断言拦不住「读到了，但读到的是密文」。sops 加密后的 YAML 键名是**明文**、
# 值是 ENC[AES256_GCM,...] 字符串，所以 vars plugin 没启用时文件会被 host_group_vars
# 当普通 YAML 读进来，`is defined` 与 `length > 0` 全部通过。
#
# 那个故障 2026-09-04 真的发生过：ansible.cfg 把 vars_plugins_enabled 写在了
# [inventory] 而不是 [defaults]，配置项被静默忽略，一路渲染进 .env，
# 最后表现为 Doctrine 的 MalformedDsnException（密文里的 [ ] 让 parse_url 失败）——
# 跟 sops 没有任何表面关联，查起来很贵。
- name: 校验凭据确实已解密（而不是原样的 sops 密文）
  ansible.builtin.assert:
    that:
      - not APP_SECRET.startswith('ENC[')
      - not POSTGRES_PASSWORD.startswith('ENC[')
      - not VAULT_ROLE_ID.startswith('ENC[')
      - not VAULT_SECRET_ID.startswith('ENC[')
    fail_msg: >-
      读到的是 sops **密文**而不是明文 —— secrets.sops.yaml 被当普通 YAML 加载了，
      community.sops 的 vars plugin 没有生效。按概率排：
        1. ansible.cfg 的 vars_plugins_enabled 不在 [defaults] 段里
           （放在 [inventory] 段会被静默忽略，回落到默认的 ['host_group_vars']）。
           用 `ansible-config dump --only-changed | grep VARIABLE_PLUGINS_ENABLED`
           确认它真的生效 —— 输出里带 (default) 就是没生效。
        2. 不是从 infra/ansible/ 目录跑的 —— ansible 只读它找到的第一份 ansible.cfg
        3. community.sops collection 没装
    quiet: true

- name: 渲染 .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ncards_compose_dir }}/.env"
    owner: "{{ ncards_deploy_user }}"
    group: "{{ ncards_deploy_user }}"
    # 0600：同机器上的其他用户读不到。这台机器上只有 deploy 与 root，
    # 而 root 本来就什么都读得到，所以这条防的是将来多出来的用户。
    mode: "0600"
  # ⚠️ no_log 是必须的：template 模块在 diff 模式下会把渲染结果打出来，
  # 那里面有 POSTGRES_PASSWORD 与 VAULT_SECRET_ID。
  # 代价是这一步的 changed/ok 之外看不到任何细节 —— 值得。
  no_log: true
