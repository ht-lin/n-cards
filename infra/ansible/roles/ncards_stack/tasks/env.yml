---
# 用 sops 解密出来的变量渲染目标主机上的 .env。
#
# 解密不在这里显式发生 —— ansible.cfg 启用了 community.sops 的 vars plugin，
# inventory/group_vars/<环境>/secrets.sops.yaml 在 playbook 启动时就已经被解开成
# 普通变量了。sops 从环境变量 SOPS_AGE_KEY 读私钥（CI 里由 job env 提供），
# 私钥**不落盘**。

- name: 校验凭据变量都已就位
  ansible.builtin.assert:
    that:
      - APP_SECRET is defined and APP_SECRET | length > 0
      - POSTGRES_PASSWORD is defined and POSTGRES_PASSWORD | length > 0
      - VAULT_ROLE_ID is defined and VAULT_ROLE_ID | length > 0
      - VAULT_SECRET_ID is defined and VAULT_SECRET_ID | length > 0
    fail_msg: >-
      secrets.sops.yaml 里的变量没读到。常见原因，按概率排：
        1. SOPS_AGE_KEY 没设，或设的是另一个环境的私钥（staging 与 production
           是两把不同的密钥，见仓库根 .sops.yaml）
        2. secrets.sops.yaml 还没创建 —— 从 secrets.sops.yaml.example 复制并
           `sops -e -i`，见 docs/runbooks/staging-first-boot.md 第 6 步
        3. community.sops collection 没装（ansible-galaxy collection install -r requirements.yml）
    # ⚠️ 断言失败时 Ansible 默认会把被检查的变量打进日志 —— 那正是凭据。
    quiet: true
  no_log: true

- name: 渲染 .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ncards_compose_dir }}/.env"
    owner: "{{ ncards_deploy_user }}"
    group: "{{ ncards_deploy_user }}"
    # 0600：同机器上的其他用户读不到。这台机器上只有 deploy 与 root，
    # 而 root 本来就什么都读得到，所以这条防的是将来多出来的用户。
    mode: "0600"
  # ⚠️ no_log 是必须的：template 模块在 diff 模式下会把渲染结果打出来，
  # 那里面有 POSTGRES_PASSWORD 与 VAULT_SECRET_ID。
  # 代价是这一步的 changed/ok 之外看不到任何细节 —— 值得。
  no_log: true
