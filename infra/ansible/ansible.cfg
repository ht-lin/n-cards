# Ansible 配置（T-012）。
#
# 只在 infra/ansible/ 目录下执行 playbook 时生效 —— Ansible 按
# ANSIBLE_CONFIG → ./ansible.cfg → ~/.ansible.cfg → /etc/ansible/ansible.cfg 的顺序找，
# 且**只用找到的第一份**。所以所有命令都从本目录跑：
#
#     cd infra/ansible && ansible-playbook -i inventory/staging.yml deploy.yml
#
# CI 里同样如此（.github/workflows/deploy.yml 的 working-directory）。

[defaults]
inventory = inventory/staging.yml
roles_path = roles
collections_path = collections
stdout_callback = yaml
# 不生成 .retry —— 单主机部署，重试就是重跑，留个文件只会脏工作区。
retry_files_enabled = False
# 部署要看清每一步在哪台机器上做了什么，别把任务名折叠掉。
display_skipped_hosts = False
# facts 缓存关掉：preflight 要的就是**这一次**的真实内存与磁盘余量，
# 缓存住的 facts 会让「磁盘不够」这类断言在一台已经满了的机器上照样通过。
gathering = explicit
interpreter_python = auto_silent

# sops vars plugin：inventory/group_vars/*/secrets.sops.yaml 会被自动解密进变量空间。
# host_group_vars 必须一起列出 —— 显式配置 vars_plugins_enabled 会**覆盖**默认值，
# 只写 community.sops.sops 的话普通的 group_vars/host_vars 就全都不加载了。
[inventory]
enable_plugins = yaml, ini
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
# 一次 SSH 连接跑完多个模块，单主机部署上能省掉几十次握手。
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
