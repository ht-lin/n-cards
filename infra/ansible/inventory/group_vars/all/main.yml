---
# 两个环境共用的变量（T-012）。环境相关的值在 group_vars/ncards_{staging,production}/ 里。

# ---------------------------------------------------------------- 路径
# docs/runbooks/vault-unseal.md 从 T-005 起就假设了这个路径，这里把它坐实。
ncards_deploy_path: /opt/ncards
ncards_state_path: "{{ ncards_deploy_path }}/state"
ncards_snapshot_path: /var/backups/ncards

ncards_deploy_user: deploy

# ---------------------------------------------------------------- compose
# 叠加链的顺序**不能改**：base → prod → staging。
# prod 提供生产形态（file 后端的 vault、GHCR 镜像、443），staging 只再覆盖
# 域名、资源配额、日志级别三处。少一层或换个顺序都会静默得到另一套配置。
ncards_compose_dir: "{{ ncards_deploy_path }}/infra/compose"
ncards_compose_files:
  - docker-compose.base.yml
  - docker-compose.prod.yml
  - docker-compose.staging.yml

ncards_image_repo: ghcr.io/ht-lin/n-cards-backend

# ---------------------------------------------------------------- 保留策略
# 40 GB 的盘上这两个数字不是随手定的，账见 infra/ansible/README.md：
#   镜像保留 3 个 ≈ 600 MB，够回滚两步；再多就是拿磁盘换一个用不上的深度。
#   快照 10 份在 M0 的合成数据下是几十 MB；接了真实数据量后要由 T-406 重定。
ncards_image_keep: 3
ncards_snapshot_keep: 10

# 快照前要求的最小可用磁盘。留 5 GB 是因为一次部署最坏情况要同时容纳：
# 新镜像（~300 MB）+ 旧镜像 + 一份快照 + Docker 解压过程的临时空间。
ncards_min_free_gb: 5

# ---------------------------------------------------------------- 超时
# 这台机器是 2 vCPU，部署期间迁移 + cache:warmup + pg_dump 会把 CPU 打满，
# 所以这些值按小机器给，别按开发机的手感调小。
ncards_compose_wait_timeout: 120
ncards_health_retries: 12
ncards_health_delay: 5

# false 时跳过 /health/ready 判定，只要 /health/live 通就算过。
# 只在**首启**用（那时 Vault 还没 init，ready 必然 503）：
#     ansible-playbook deploy.yml -e ncards_wait_for_ready=false
ncards_wait_for_ready: true

# 部署时是否执行 Doctrine 迁移。CI 默认 true；首启和纯回滚时由命令行关掉。
ncards_run_migrations: true

# ------------------------------------------- 客户端版本与维护窗口（T-112）
# 两个环境同值，所以在这里而不是各自的 group_vars 里。
#
# ⚠️ 在 T-112 之前这两个值在整个 infra 里**一次都没出现过** —— 生产读的是烤进
# 镜像的 backend/.env（prod overlay 把 dev 的 bind-mount reset 掉了，prod target
# 直接 COPY . .）。那时无人可见所以无害；而 `GET /v1/config` 一上线就开始把
# MIN_SUPPORTED_CLIENT **对外宣告**成强制升级基线，于是抬高基线这个纯运维动作
# 此前需要重新构建并推送一个镜像。这两行把它变回一次 deploy.yml。
#
# 格式 `platform/x.y.z (build)`，与 `X-Client` 同一形态。配错时是 500，不是 4xx ——
# 服务端配置错误该以 5xx 示人。
#
# ⚠️ 爆炸半径不同，部署前要知道：min 配坏会让**每个**请求 500（含 /health/*），
# 于是这个 playbook 的健康门禁会当场拦住它；latest 或下面那个窗口配坏**只**影响
# /v1/config，/health/ready 照样 200，部署照过 —— 唯一的安全网是 §14.4 的 5xx 告警。
# 完整论证在 backend/src/Shared/Application/Config/ClientConfigProvider.php 的类注释。
#
# 值保守是刻意的：App 还没发布，把任何客户端挡在门外都是纯粹的误伤。
ncards_min_supported_client: "android/0.0.0 (1)"

# 商店上最新的版本。消费者是**仍在支持范围内**的客户端（「有新版可用」软提示），
# 不是强制墙 —— 强制墙的信号是 426 本身。抬高它跟着 Play 发布走。
ncards_latest_client: "android/0.1.0 (1)"

# §9.2 的计划维护窗口：每周二 03:00–04:00 CET，提前 24 小时通过 /v1/config 下发，
# 客户端展示横幅（维护期间离线读卡不受影响 —— 离线优先架构的额外收益）。
#
# ⚠️ 两头**必须成对**填写，RFC 3339 且 **offset 必填**（德国是 CET/CEST 两个
# offset，不带 offset 的值会按容器时区解释，于是同一份配置在两个环境指向不同时刻）。
# 都留空即「无窗口」，这是常态。只配一头 → 500，刻意如此。
#
# 发一次公告 = 改这两行 + 跑一次 deploy.yml（app 容器重建）。为什么接受这个代价
# 而不是做成免重启的运行时开关，见 backend/config/packages/ncards_maintenance.yaml。
#
# 只给某一个环境公告时，在那个环境的 group_vars/main.yml 里覆盖这两行。
#   ncards_maintenance_window_start: "2026-09-15T03:00:00+02:00"
#   ncards_maintenance_window_end: "2026-09-15T04:00:00+02:00"
ncards_maintenance_window_start: ""
ncards_maintenance_window_end: ""
