---
# staging 环境变量（T-012）。**本文件不含任何凭据** —— 凭据在同目录的
# secrets.sops.yaml 里（sops/age 加密），由 community.sops 的 vars plugin 自动解密。

# ---------------------------------------------------------------- 域名与 TLS
# 刻意**不带 scheme**：Caddy 见到裸域名才会自动申请证书并开 80→443 重定向。
# 写成 https:// 也能跑，但那样就关掉了自动 HTTP 重定向，冒烟测试第 2 条会红。
ncards_site_address: api.staging.n-cards.de

# ACME 账户邮箱。Let's Encrypt 用它发证书过期提醒 —— 填一个真的能收到信的地址。
ncards_acme_email: ops@n-cards.de

# ACME 目录。默认是 Let's Encrypt 生产目录。
#
# ⚠️ 排练时改成 staging 目录，避开生产的速率限制（同一域名每周 5 张证书）：
#   https://acme-staging-v02.api.letsencrypt.org/directory
# 但 staging 目录签出来的证书**不受公共信任**，此时冒烟测试要带 SMOKE_INSECURE=1。
# **验收必须在生产目录、且不带 SMOKE_INSECURE 的情况下跑**（任务卡的 curl -I 那条）。
ncards_acme_ca: https://acme-v02.api.letsencrypt.org/directory

# ---------------------------------------------------------------- SSH
# 非 22 端口。**明文入库是刻意的** —— 它不是秘密：
# 换端口的价值是把互联网背景扫描的噪声降下来，**不是安全边界**。
# 边界是「仅密钥 + 禁 root + fail2ban + ufw」这四条。
# 把它做成 secret 只会让 inventory 读不懂，换不来任何实质防护。
ncards_ssh_port: 2242

# 允许登录 deploy 用户的公钥。多把就写成多行。
# ⚠️ 私钥对应 GitHub repository secret DEPLOY_SSH_KEY。
ncards_deploy_authorized_keys:
  [
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDy3VGi+WBfqi4I/ZQCVX/y6cUUXgyYF6H2RYBwIRFNG ncards-deploy@github-actions,
  ]
# 例：
# ncards_deploy_authorized_keys:
#   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... ncards-deploy@github-actions"

# ---------------------------------------------------------------- 日志
# staging 相对 prod 的唯一放松（见 docker-compose.staging.yml 的头注释）。
ncards_log_level: debug

# ---------------------------------------------------------------- 机型（仅记录）
# ⚠️ §4.1 假设的是 CCX23（4 vCPU / 16 GB / 160 GB）。staging 实机小一档 ——
# 这是 T-012 记录在案的第一条偏差，见 docs/tasks/M0.md 的交付产物段。
# 本变量不参与任何逻辑；真正的判据是 preflight 采集的实测 facts
# （/opt/ncards/state/host-facts.json）。
ncards_machine_type: "CX22 (2 vCPU / 4 GB / 40 GB)"

# ---------------------------------------------------------------- 邮件（T-102）
# ⚠️ 这里**只有非凭据项**。发信 DSN（含 SMTP 口令）在 secrets.sops.yaml 的
# MAILER_DSN 里，与 VAULT_SECRET_ID 同一口径。

# 发件人地址。SPF / DKIM / DMARC 记录必须配在**这个地址的域**上，
# 否则几乎必进垃圾箱（§3.2）—— 记录模板与推进节奏见 docs/runbooks/email-dns.md。
#
# ⚠️ staging 用的是**与生产同一个发信域**，不是 staging.n-cards.de。这是刻意的：
# §3.2 的上线必需项是「向 Gmail / GMX / Web.de / Outlook 各发一封 OTP，确认不进
# 垃圾箱」，而那 4 次验证要在 staging 上做 —— 换个子域去测，测到的就不是生产
# 会用的那套 SPF/DKIM/DMARC 与域名声誉，验证等于白做。
#
# 代价是 staging 的发信量会算进生产域的声誉。可接受：staging 只有合成数据与
# 团队自己的测试邮箱，量级是每天个位数。§3.2 的「独立事务子域」是明确后置项 ——
# 真要隔离，那是二期跟着专业 ESP 一起做的事。
ncards_mail_from_address: no-reply@n-cards.de
ncards_mail_from_name: N-Cards

# §14.4 `email_send_total{provider,template,result}` 的 provider 标签。
#
# ⚠️ Q3（邮件服务商选型，§17.5）**仍是开放问题**，所以这里是 `unset` 而不是
# 某个具体服务商。指标里出现 provider="unset" 就是「Q3 还没定」的直接可见证据 ——
# 比一个猜出来的默认值诚实。定下来后改这一行 + 换 secrets 里的 MAILER_DSN，
# 别的都不用动（这正是 MailSenderInterface 抽象的意义，§3.2）。
ncards_mail_provider: unset
