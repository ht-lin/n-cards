# N-Cards API — 唯一真相源（§13.1 第 1 条）。
#
# ============================================================================
# 改这个文件之前先读这一段
# ============================================================================
# 1. 任何接口变更**必须先改这里**，并在**同一个 PR** 内一并改后端实现、契约测试
#    与 Android 生成代码（§13.1）。反过来做——先写实现再补契约——会让契约跟着
#    实现漂移，这正是本项目禁用 API Platform / NelmioApiDocBundle 的理由。
# 2. `/v1` 内**只允许向后兼容的变更**（§13.6）：可以加端点、加可选请求字段、
#    加响应字段、加枚举值、放宽校验；**不可以**删字段、改类型、把可选变必填、
#    收紧校验、改错误 code 的含义。破坏性变更走 `/v2`，`/v1` 并行 6 个月。
# 3. 所有 schema 必须 `additionalProperties: true`（§13.1 第 5 条），
#    每个操作必须有 operationId、至少一个错误响应、每个响应必须有 example。
#    这四条由 `.spectral.yaml` 强制，本地跑 `npm run lint:api`。
#
# ============================================================================
# ⚠️ 关于 `additionalProperties: true` 在**请求**方向上的含义
# ============================================================================
# §13.1 第 5 条要求所有 schema 都 `additionalProperties: true`，它的目的是让
# **客户端**前向兼容：服务端将来加响应字段时，老客户端不能因为多了一个键就崩。
#
# 但后端对**请求体**里的未知字段是**主动拒绝**的（`400 validation_failed` +
# `errors[].code = unknown_field`，见 §6.1 的字段错误码词表）。也就是说本契约在
# 请求方向上比实现**宽**——契约描述的是「最大可接受形状」，不是「服务端保证接受
# 任意字段」。这是刻意的，不要为了「让契约和实现一致」把请求 schema 改成
# `additionalProperties: false`：那会让 §13.6「新增可选请求字段」变成破坏性变更。
#
# ============================================================================
# ⚠️ 路径里**没有** `/v1`
# ============================================================================
# `servers[].url` 已经带了 `/v1`（§6.1 的基址就是这么定的，§17.2 的参考片段也
# 这么写），所以下面 paths 下写的是 `/cards`，而后端路由是 `/v1/cards`。
# `league/openapi-psr7-validator` 会自动处理这个 base path 落差，
# 见 backend/tests/Api/Support/OpenApiContract.php。
#
# ============================================================================
# 本文件的范围（T-007 首版）
# ============================================================================
# Auth + Cards + 全套通用组件。§6.2 的其余端点（Me/Devices、Sharing、Friends、
# Sync、Config）由各自的任务在「先改契约」时补入——这不是遗漏，是契约优先的
# 正常工作方式。通用组件已经全部就位，补端点时直接 $ref 即可。

openapi: 3.1.0

info:
  title: N-Cards API
  version: "1.0.0"
  summary: 面向德国及欧盟市场的移动卡券钱包
  description: |
    会员卡 / 积分卡 / 优惠券的条码收纳与共享。

    **通用约定**（§6.1）

    - 字段名一律 `snake_case`；时间一律 RFC 3339 UTC。
    - 成功响应 `application/json; charset=utf-8`；错误响应 `application/problem+json`
      （RFC 9457，**不带** charset —— JSON 按定义就是 UTF-8）。
      媒体类型的 key 里不写 charset，那是传输层的事。
    - 认证 `Authorization: Bearer <access_jwt>`（Access token 15 分钟，EdDSA）。
    - **所有** `/v1` 请求必须带 `X-Client`，缺失即 `400`。
    - 所有 `POST` 支持 `Idempotency-Key`（UUID，Redis 存 24h）。
    - 分页一律游标式 `?cursor=&limit=`，**不使用 offset**——`offset` / `page` /
      `skip` / `per_page` / `start` 任一出现即 `400 validation_failed`
      （`errors[].code = unsupported_parameter`）。
  contact:
    name: N-Cards Engineering
    url: https://github.com/ht-lin/n-cards
  license:
    name: Proprietary
    # SPDX 表达式。OAS 3.1 里 `identifier` 是**可选**的，但 openapi-generator 的
    # spec 校验器把它当必填（T-010 实测：不写就是 `Error count: 1`，生成直接中止）。
    # 出路有两条 —— 给生成器加 `--skip-validate-spec`，或者把这一行补上。选后者：
    # 前者会连同「$ref 指不到」「响应少了 content」这类真问题一起关掉，
    # 而这一行本身是 3.1 鼓励写的元数据，不影响任何 API 表面（§13.6 的禁止项一条不沾）。
    # `LicenseRef-` 前缀是 SPDX 给非标准许可证留的合法形态。
    identifier: LicenseRef-N-Cards-Proprietary

servers:
  - url: https://api.n-cards.de/v1
    description: production
  - url: https://api.staging.n-cards.de/v1
    description: staging（合成数据，禁止生产数据副本 —— §14.1）

tags:
  - name: auth
    description: |
      认证与会话（§7.1）。

      ⚠️ 这一组里**只有 `POST /auth/logout` 需要 Bearer**，其余四个用
      `security: []` 覆盖掉全局要求。别把这一组整体当成「公开的」——
      服务端的白名单按**操作**逐条列出，不是按 `/auth/` 前缀。
  - name: me
    description: 当前用户与他的设备（§6.2）。全部需要 Bearer。
  - name: cards
    description: 卡的 CRUD 与摆放。owner 是唯一的写入者；viewer 只能看，以及摆放自己钱包里的位置（§5.2）。

# 默认全局要求 Bearer。
#
# ⚠️ 覆盖它的是 auth 组里的**四个**端点（otp/request、otp/verify、
# magic/consume、token/refresh），**不含 logout** —— 它是这一组里唯一
# 需要 Bearer 的那个。服务端侧的对应物是
# `Shared\Infrastructure\Http\AuthenticationListener::PUBLIC_ROUTES`，
# 两者由 `tests/Api/AuthenticationCoverageTest` 逐条对账。
security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # 认证（§6.2 / §7.1）—— 无需 Bearer
  # ==========================================================================
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: 请求登录用的一次性验证码
      description: |
        **恒返回 202**，无论该邮箱是否已注册（§3.8 防账号枚举）。

        服务端在这条路径上**不查 `users`** —— 它在结构上就不知道邮箱注册过没有，
        因此对任意地址都生成并发送一个真实的验证码（[ADR-0014](https://github.com/ht-lin/n-cards/blob/main/docs/adr/0014-otp-always-sends-a-code.md)）。
        这也是**唯一的注册路径**：首次 `POST /auth/otp/verify` 成功即创建 `users` 行。

        客户端**不能**从本接口的响应推断账号是否存在，也**不应该**尝试 ——
        「这个邮箱要走登录还是注册」对客户端是同一个流程（邮箱 → 验证码 → username）。

        发出去的那封信里同时有**两样东西**：6 位码，以及一个免输码的 Magic Link
        （[ADR-0016](https://github.com/ht-lin/n-cards/blob/main/docs/adr/0016-magic-link-delivery-and-landing-page.md)）。
        两者挂在**同一条**挑战上、共用一个 `consumed_at`，所以它们是同一次登录的
        两个入口而不是两次机会 —— 用掉任何一个，另一个立刻失效。
        链接的消费走 `POST /auth/magic/consume`。

        限速（§7.5）：按 `email_hash` 1/min、5/h、10/day；按 IP 20/h。
        这三个窗口是本端点唯一的滥用闸门 —— 它挡的是「用 N-Cards 的域名给别人的
        收件箱发信」，所以 429 时**不要**自动重试，照 `Retry-After` 退避。
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
            example:
              email: anna@example.de
              locale: de
      responses:
        '202':
          description: 挑战已创建（无论邮箱是否存在）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpChallenge' }
              example:
                challenge_id: 0192f3a1-b2c3-7d4e-8f01-23456789abcd
                expires_at: "2026-08-29T10:35:00Z"
                resend_after_seconds: 60
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: 校验验证码，换取令牌对
      description: |
        首次验证成功即注册（创建 `users` 行）。此时 `username` 仍为 `null`，
        用户处于 `onboarding_incomplete` 状态：除 `GET /me`、`POST /me/username`、
        `POST /auth/logout` 外，所有 `/v1` 端点对其返回 `403 username_required`。
        客户端据 `user.onboarding_complete` 路由到 username 设定页，**该页不可跳过**（§5.2）。

        限速（§7.5）：按 `challenge_id` 5 次总计；按 IP 60/h。
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerification' }
            example:
              challenge_id: 0192f3a1-b2c3-7d4e-8f01-23456789abcd
              code: "418396"
              device:
                id: 0192f3a1-b2c3-7d4e-8f01-0000000000de
                platform: android
                model: Pixel 7a
                os_version: "14"
                app_version: 1.4.0
      responses:
        '200':
          description: 登录成功
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example:
                access_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkyZjNhMSJ9.c2ln
                expires_in: 900
                refresh_token: 9tK3zQ1sX7bF0pR4hN8mV2wY6cL5dJ0aG3eU7iO1kS4
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: null
                  locale: de
                  onboarding_complete: false
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/magic/consume:
    post:
      tags: [auth]
      operationId: consumeMagicLink
      summary: 消费 Magic Link 令牌
      description: |
        ⚠️ **必须是 POST**。企业邮件安全网关（Microsoft Defender、Barracuda 等）
        会自动 `GET` 邮件里的所有链接做扫描——如果 Magic Link 是 `GET` 即消费，
        用户还没点开就已失效（§7.1）。邮件里的链接指向落地页，`GET` 只渲染
        「点击继续登录」按钮，实际消费走本端点。

        ⚠️ **调用方是 App，不是落地页**（[ADR-0016](https://github.com/ht-lin/n-cards/blob/main/docs/adr/0016-magic-link-delivery-and-landing-page.md)）。
        落地页是一份静态 HTML，它的按钮通过 App Links / `intent://` 把令牌交给 App，
        由 App 带上自己的 `device` 发本请求。浏览器构造不出合法的请求体 ——
        `device.platform` 的取值域只有 `android`，`device.id` 是安装级的客户端生成 UUID。

        令牌与 `POST /auth/otp/request` 那封信里的 6 位码挂在**同一条**挑战上：
        用掉任何一个，另一个立刻 401。重复消费同一个令牌同样 401。

        限速（§7.5）：按 IP 60/h。**没有**按挑战的次数上限 —— 令牌是 32 字节
        CSPRNG，猜错的令牌找不到任何一行可以累加。
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MagicLinkConsumption' }
            example:
              token: bF0pR4hN8mV2wY6cL5dJ0aG3eU7iO1kS49tK3zQ1sX7
              device:
                id: 0192f3a1-b2c3-7d4e-8f01-0000000000de
                platform: android
                model: Pixel 7a
                os_version: "14"
                app_version: 1.4.0
      responses:
        '200':
          description: 登录成功
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example:
                access_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkyZjNhMSJ9.c2ln
                expires_in: 900
                refresh_token: 9tK3zQ1sX7bF0pR4hN8mV2wY6cL5dJ0aG3eU7iO1kS4
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: anna_b
                  locale: de
                  onboarding_complete: true
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 轮换令牌对
      description: |
        每次刷新签发**新的** refresh token，旧的立即失效（§7.1）。

        ⚠️ 收到一个**已被使用过**的 refresh token 会被判定为令牌被窃：撤销该会话
        家族的全部令牌、写 `audit_log(reuse_detected)`、告警、给用户发安全提醒邮件。
        客户端拿到 `401 token_invalid` 时必须清空本地会话并跳登录，**不要重试**。

        限速（§7.5）：按 session 60/h。
      security: []
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRefresh' }
            example:
              refresh_token: 9tK3zQ1sX7bF0pR4hN8mV2wY6cL5dJ0aG3eU7iO1kS4
      responses:
        '200':
          description: 轮换后的新令牌对
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example:
                access_token: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkyZjNhMSJ9.bmV3
                expires_in: 900
                refresh_token: Q1sX7bF0pR4hN8mV2wY6cL5dJ0aG3eU7iO1kS49tK3z
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: anna_b
                  locale: de
                  onboarding_complete: true
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 撤销当前会话
      description: |
        这是 auth 组里**唯一需要 Bearer** 的端点。撤销当前 session；
        access token 不做黑名单（15 分钟窗口可接受，§7.1），但 refresh 立即失效。

        `onboarding_incomplete` 的用户也可以调用（否则中途放弃注册的人无法登出）。
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已登出（无响应体）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ==========================================================================
  # 我 / 设备（§6.2 / §7.2 T02）
  # ==========================================================================
  #
  # §7.2 把「邮箱被接管 → 账号被接管」记为**已接受**的风险，缓解手段只有三条：
  # 新设备登录提醒信、这三个端点、以及二期的 Passkey。也就是说这个页面是
  # 用户在账号被接管之后唯一能自救的地方。
  #
  # ⚠️ 三个端点对「不存在的设备」与「别人的设备」返回**同一个 404**，不是 403。
  # `devices.id` 由客户端生成、不是凭据，403 等于确认「这个 id 存在，只是不是你的」——
  # 而那是一条现成的存在性信道。

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: 我的资料
      description: |
        **`onboarding_incomplete` 状态下仍然可达的三个端点之一**（另外两个是
        `POST /me/username` 与 `POST /auth/logout`，§5.2）。客户端正是靠这里的
        `user.onboarding_complete` 决定下一步去哪：`false` → username 设定页
        （不可跳过、不可返回）；`true` → 钱包。

        所以它**必须**免受 onboarding 拦截 —— 把它挡住，客户端就再也问不出
        「我是不是卡在注册中间态」，注册流程无法完成。
      parameters:
        - $ref: '#/components/parameters/XClient'
      responses:
        '200':
          description: |
            我的资料。示例特意用注册中间态（`username: null` /
            `onboarding_complete: false`）—— 那是这个端点最要紧的一种响应。
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: null
                  locale: de
                  onboarding_complete: false
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

    patch:
      tags: [me]
      operationId: updateMe
      summary: 修改我的资料
      description: |
        目前只能改 `locale`。

        ⚠️ **它不在 onboarding 白名单里。** 未设 username 的用户调它得到
        `403 username_required` —— §5.2 / §6.2 的豁免清单里只有 `GET /me`。
        在 username 设定之前开一条写 `users` 的路径，正好是那个拦截器要挡的事；
        而注册期的语言由 `POST /auth/otp/request` 的 `locale` 字段决定，
        不需要这个端点。

        ⚠️ **请求体里出现 `username` → `409 username_immutable`，不静默忽略**
        （§6.2）。这是那条「username 不可变」不变量在本端点上的落点：
        静默忽略会让客户端以为改成功了，而下一次 `GET /me` 才发现没有 ——
        那种不一致比一个明确的 409 难查得多。

        没有 `display_name`（v1.1 C10 移除），将来也不会有。

        ⚠️ **空对象 `{}` 返回 `400 malformed_request`，不是 200 no-op。**
        `locale` 是当前唯一的字段，因此 `required`；一个什么都不改的 PATCH
        只可能是客户端 bug。将来加了通知偏好之后，这条会放宽成「至少给一个字段」
        —— 那是 §13.6 允许的放宽方向（收紧才是禁止的）。
      parameters:
        - $ref: '#/components/parameters/XClient'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdate' }
            example:
              locale: en
      responses:
        '200':
          description: |
            改完之后的完整资料。**与 `GET /me` 同一个 `UserEnvelope`** ——
            客户端拿它直接替换本地副本，不需要再拉一次。
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: anna_b
                  locale: en
                  onboarding_complete: true
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # --------------------------------------------------------------------------
  # ⚠️ 本组里**只有 POST /me/username 一个写 username 的操作**，而且必须一直如此。
  #
  # §3.8 的「可变性」那一行写着：username 不可变，设定后**无 API 可修改**。
  # 这份契约就是那条产品不变量的强制点 —— 加一个 PATCH/PUT /me/username，
  # 或者让 PATCH /me 接受 username 字段，都等于把它删掉。
  # 要动之前先读 §17.5 的 Q10（一期一律拒绝改名，不开人工通道）。
  # --------------------------------------------------------------------------
  /me/username:
    post:
      tags: [me]
      operationId: setUsername
      summary: 一次性设定 username
      description: |
        注册流程的**最后一步**，也是 `onboarding_incomplete` 状态唯一的出口
        （§5.2）：`POST /auth/otp/verify` 成功即建行，但那一行的 `username` 是
        `null`，在设定之前所有其他 `/v1` 端点都返回 `403 username_required`。

        **一次性写入。** 已经设过了 → `409 username_immutable`（**不静默忽略**）。
        没有 `PATCH` / `PUT` 对应端点，不可变性就是靠这一点保证的。

        客户端**必须**在发送前做 `trim` + `lowercase(Locale.ROOT)` 归一化，
        并且**必须**用二次确认对话框（`Dieser Name kann später nicht geändert
        werden.`）—— 这是本产品为数不多的不可逆操作之一，与删号同级（§3.8）。
        设定页还必须提示「其他人可通过该名字找到你，请勿使用真实姓名或邮箱」。

        三种失败要分开处理，别合并成一句「出错了」：

        | code | 状态 | UI 该做什么 |
        |---|---|---|
        | `username_invalid` | 422 | 输入框下标红，让用户改（长度 / 字符集 / 保留词） |
        | `username_taken` | 409 | 同上，文案是「这个名字已经有人用了」 |
        | `username_immutable` | 409 | **不是**输入错误：本机状态过期了，重新拉 `GET /me` |
        | `limit_exceeded` | 422 | 次数用尽，见下 |

        ⚠️ **`422 limit_exceeded` 是终局，不是「稍后再试」。** §7.5 给这个端点的
        配额是按 user **10 次总计**的生命周期计数（不是滑动窗口，`Retry-After`
        不适用，所以它不是 429）。只有真正查了占用情况的请求才消耗次数 ——
        `username_invalid` 与 `username_immutable` 都不消耗。详见 ADR-0017。
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsernameAssignment' }
            example:
              username: anna_b
      responses:
        '200':
          description: |
            已设定。响应里的 `user.onboarding_complete` 恒为 `true` ——
            客户端据此离开设定页。
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
              example:
                user:
                  id: 0192f3a1-b2c3-7d4e-8f01-00000000a11a
                  username: anna_b
                  locale: de
                  onboarding_complete: true
                  created_at: "2026-08-29T10:30:12Z"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/devices:
    get:
      tags: [me]
      operationId: listDevices
      summary: 我的设备列表
      description: |
        只返回**未撤销**的设备，按 `last_seen_at` 倒序。

        `is_current` 标记发起本次请求的那台设备 —— 它由 access token 的 `did`
        比对得出，是**请求**的属性而不是设备行的属性（同一台设备在另一个请求里
        就不是当前的了）。

        **不分页**：§7.5 没有给设备数设限额，但真实上限是个位数。

        ⚠️ 响应里**没有** `push_token`。它是一个发给第三方（FCM / Google Ireland）
        的标识符，ROPA §8.2 登记的用途只有投递推送；回显它不服务于任何用例
        （客户端自己刚上报过），却会让它多出现在一处响应体里。
        `push_token_updated_at` 有 —— 客户端要靠它判断自己上报的那个还新不新鲜。
      parameters:
        - $ref: '#/components/parameters/XClient'
      responses:
        '200':
          description: 设备列表
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
              example:
                devices:
                  - id: 0192f3a1-b2c3-7d4e-8f01-0000000000de
                    platform: android
                    model: Pixel 7a
                    os_version: "14"
                    app_version: 1.4.0
                    is_current: true
                    last_seen_at: "2026-09-07T08:12:44Z"
                    created_at: "2026-08-29T10:30:12Z"
                    push_token_updated_at: "2026-09-07T08:12:44Z"
                  - id: 0192f3a1-b2c3-7d4e-8f01-0000000000df
                    platform: android
                    model: Galaxy S21
                    os_version: "13"
                    app_version: 1.3.2
                    is_current: false
                    last_seen_at: "2026-09-02T19:40:03Z"
                    created_at: "2026-08-30T21:05:55Z"
                    push_token_updated_at: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/devices/{deviceId}:
    delete:
      tags: [me]
      operationId: revokeDevice
      summary: 远程登出某设备
      description: |
        撤销这台设备**并且**撤销它的全部会话（`revoked_reason = user_revoked`）。

        ⚠️ 两件事都做才有意义：只撤设备的话，那台机器手里的 refresh token
        仍然有效 90 天。撤销后该设备的下一次 `POST /auth/token/refresh` 立刻 401。

        ⚠️ **已签发的 access token 不会失效**（§7.1 不做黑名单），
        所以被踢的设备最长还能读 15 分钟。这是被接受的窗口，见 ADR-0015。

        撤销同时清空 `push_token`（ROPA §8.2：设备撤销后即删）。

        允许删自己当前这台，效果等同登出。**幂等**：重复删仍然 204，
        且不会重置「什么时候被踢下线的」这个时间戳。

        那台设备之后仍然可以用邮箱验证码重新登录（`devices.id` 会被复活并按
        新设备处理，含提醒信）—— 远程登出不是封禁。
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已撤销（无响应体）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /me/devices/{deviceId}/push-token:
    put:
      tags: [me]
      operationId: updatePushToken
      summary: 更新 FCM token
      description: |
        客户端在每次启动与每次 FCM 令牌轮换后上报。

        `push_token: null` 表示**清除**（用户关掉了通知权限）——
        它与「省略该字段」不同，后者是 `400 validation_failed`。
        空串同样是 `400`：想清除就发 `null`，静默地把空串当成清除
        会让客户端的 bug 一直活着，而它的另一面是「明明设置了却收不到推送」。

        已撤销的设备返回 `404` —— 允许它继续上报的话，一台被远程登出的设备
        可以把自己留在推送目标里，而用户以为它已经被踢掉了。

        ⚠️ M1 阶段服务端**只落库，不发推送**：FCM 整条链路归 T-306（M3）。
        这个端点先存在，是为了 T-306 上线当天不至于一个令牌都没有。
      parameters:
        - $ref: '#/components/parameters/XClient'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenUpdate' }
            example:
              push_token: fJ8xK2mN0pQ:APA91bH_example_fcm_registration_token
      responses:
        '204':
          description: 已更新（无响应体）
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '426': { $ref: '#/components/responses/ClientTooOld' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

