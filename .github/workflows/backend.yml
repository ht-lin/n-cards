# 后端质量门禁（§13.3）。由 T-002 交付的最小版本，T-003 补了 postgres service。
#
# T-011 补齐了 Doctrine 迁移 up/down 往返（见下方 migration-check.sh 一步），
# 并把本文件改成 **reusable workflow**：触发编排搬到了 pr.yml 与 main.yml，
# gitleaks / 敏感日志扫描 / TODO 检查这三条全仓通用的门禁搬到了 shared.yml。
# （vault service 由 T-005 补上，见下方注释。）
# （redis service 由 T-004 补上，见下方注释；契约测试由 T-004 起以
#  tests/Api/ProblemDetailsContractTest 的形态存在，T-007 起补上了对整份
#  docs/api/openapi.yaml 的校验：OpenApiDocumentTest 守文档本身与路由表的一致性，
#  OpenApiContractHarnessTest 用正反夹具证明校验器真的会咬人。
#  Problem 那部分**没有**换掉 —— openapi.yaml 的 Problem 是一个指向
#  problem-details.schema.json 的 $ref，两条路径校验的是同一份 schema。）
#
# ⚠️ T-003 有意的越界：本文件原本写着「集成测试 services 由 T-011 补齐」，
# 但 T-003 的核心验收标准是「PG 不可用时 /health/ready 返回 503」，
# 没有真实 PG，CI 里就只剩一条用替身跑的单测，真实 DBAL 连接路径完全没被验证
# （tests/Integration/Health/DatabaseHealthCheckTest 会直接 skip）。
# 所以 postgres service 提前到这里。
#
# ⚠️ T-004 同理补上了 redis service：幂等键的核心保证是 `SET NX EX` 的**原子性**，
# 而那条保证只有真 Redis 能验（替身实现怎么写都是对的）。没有这个 service，
# tests/Integration/Shared/Redis/RedisIdempotencyStoreTest 会整组静默 skip，
# 于是「并发重试只会执行一次」这条在 CI 里没人验证。
#
# ⚠️ **不要**把 `backend` 加进 scripts/setup-branch-protection.sh 的
# required_status_checks。这条 job 是有条件运行的（pr.yml 的 changes 过滤器决定），
# 不碰 backend/** 的 PR 永远不会上报这个 context，配上
# strict_required_status_checks_policy 会把那类 PR 永久卡死。
# 唯一的 required check 是 pr.yml 的 `pr-gate` —— 它总是运行，并把本 job 的
# skipped 正确地算作通过。完整推理见 docs/adr/0008-ci-gate-topology.md。
#
# ⚠️ 触发条件（原来的 paths 过滤）现在住在 pr.yml 的 `changes` job 里，
# 改这条流水线的适用范围要去那里改。其中 `docs/api/**` 那一条是 T-007 加的，
# 理由必须跟着一起搬：契约文件住在 docs/ 下，而校验它的契约测试
# （tests/Api/OpenApiDocumentTest、tests/Api/OpenApiContractHarnessTest）住在
# backend/ 下 —— 少了它，「只改 openapi.yaml、不碰 backend/**」的 PR 不会触发
# 本流水线，契约与实现的漂移当场溜过去，而那正是这两条测试唯一的存在理由。
name: backend

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality-gates:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 版本与 infra/compose/docker-compose.base.yml 保持一致 —— CI 跑的和本地
    # 跑的不是同一个 Postgres 大版本，这类门禁就失去意义了。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ncards
          POSTGRES_USER: ncards
          POSTGRES_PASSWORD: ncards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ncards -d ncards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # T-004 起：幂等键存储。版本与 infra/compose/docker-compose.base.yml 一致。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # T-005 起：Transit 加密门面。dev 模式（内存后端、自动 unseal、固定 root token），
      # 与 infra/compose/docker-compose.base.yml 的本地形态一致。
      #
      # 与 T-003 加 postgres、T-004 加 redis 是同一个理由：没有真 Vault，
      # tests/Integration/Shared/{Crypto,Vault}/* 与 Health/VaultHealthCheckTest 会整组静默
      # skip，于是三条验收标准 ——「加解密往返一致」「200 条 batch decrypt 有基准」
      # 「policy 确实是最小权限」—— 在 CI 里全都没人验证。
      #
      # ⚠️ AppRolePolicyTest 尤其只能在这里跑到：它是全仓库唯一验证
      # infra/vault/policies/*.hcl 真实效果的地方，别的测试都用 root token，
      # policy 对它们完全不起作用。
      vault:
        image: hashicorp/vault:1.18
        env:
          VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
          VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "vault status -address=http://127.0.0.1:8200"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # backend/.env.test 里有同样的默认值；显式写在这里是为了让「CI 连的是哪个库」
      # 一眼可见，也方便将来 T-011 换成 service 容器的动态端口。
      DATABASE_URL: postgresql://ncards:ncards@127.0.0.1:5432/ncards
      REDIS_URL: redis://127.0.0.1:6379
      VAULT_ADDR: http://127.0.0.1:8200
      # dev 模式的 root token。**不是**秘密 —— 它只存在于这个一次性的 service 容器里。
      # 生产走 AppRole（§7.4 / §17.4），见 infra/compose/docker-compose.prod.yml。
      VAULT_TOKEN: dev-only-root-token

    steps:
      - uses: actions/checkout@v4

      # PHP 版本与 backend/composer.json 的 config.platform.php 一致（§12.2：8.3+）
      # pdo_pgsql 是 composer.json 的 require 之一（T-003 起）。
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, mbstring, pdo_pgsql, sodium
          coverage: pcov
          ini-values: error_reporting=-1

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      # phpstan-symfony 需要编译好的容器 XML
      - name: Warm up container
        run: bin/console cache:warmup

      - name: php-cs-fixer（§13.3：0 差异）
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPStan（§13.3：level 8，0 error）
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Deptrac（§4.2 / §13.3：0 violation）
        run: vendor/bin/deptrac analyse --no-progress

      # 证明 deptrac 规则本身还有效，而不只是「当前代码没违规」
      - name: Deptrac 自检（跨模块 Domain 引用必须被拦下）
        run: tools/deptrac-selftest.sh

      # test 环境的库名带 `_test` 后缀（config/packages/doctrine.yaml 的 when@test），
      # service 容器只建了 `ncards`，所以这一步不能省 —— 否则
      # tests/Integration/Health/DatabaseHealthCheckTest 会静默 skip，
      # 「PG 可用时 /health/ready 真能连上」这条就在 CI 里没人验证了。
      - name: 建测试库
        run: bin/console --env=test doctrine:database:create --if-not-exists

      # T-005：启用 Transit、建三把 key、建 kv-v2 与 JWT 密钥、写两份 policy、配 AppRole。
      #
      # 脚本走 HTTP API 而不是 vault CLI —— runner 上没有那个二进制
      # （理由见 infra/vault/bootstrap.sh 顶部）。curl / jq / openssl 是 runner 自带的。
      #
      # ⚠️ 这一步**必须**在 phpunit 之前：Vault 起来了但没初始化时，
      # tests/Integration/Support/RequiresVault 会 fail 而不是 skip —— 那是刻意的，
      # 免得 bootstrap 坏掉之后测试静默变成空跑。
      - name: 初始化 Vault（Transit / policy / AppRole）
        working-directory: .
        run: infra/vault/bootstrap.sh

      # T-011：§13.3 后端表最后一行。--require-db 把「连不上库」从跳过变成失败 ——
      # 脚本默认跳过是为了让裸机上的 `composer qa` 保持全绿（与 tests/Integration
      # 里那些 markTestSkipped 的用例同一个口径），但在 CI 上 postgres service
      # 一定在，连不上就是真出了问题。
      #
      # migrations/ 目前只有 .gitkeep，往返那两步是空转；schema:validate 也还不存在
      # （ORM 属 T-101）。两处都会打印显式的说明行，不静默变绿 —— 理由见脚本头部。
      - name: Doctrine 迁移检查（§13.3 / §13.5）
        run: tools/migration-check.sh --require-db

      - name: PHPUnit + 覆盖率门禁（§13.3）
        run: |
          vendor/bin/phpunit --coverage-clover var/coverage/clover.xml
          php tools/coverage-check.php var/coverage/clover.xml

      - name: composer audit（§13.3：0 高危）
        run: composer audit
