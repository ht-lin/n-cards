# API 契约 lint（§13.1 第 2 条）。由 T-007 交付。
#
# T-011 会把它并进 §14.3 的 `shared` 流水线
# （spectral → gitleaks → openapi-codegen-diff → commitlint），
# 届时本文件应当整体并入那条，而不是继续单独存在。
#
# ⚠️ 本 workflow 带 paths 过滤，因此**不要**把它加进
# scripts/setup-branch-protection.sh 的 required_status_checks ——
# 不碰 docs/api/** 的 PR 永远不会上报这个 context，配上
# strict_required_status_checks_policy 会把那类 PR 永久卡死。
# 与 .github/workflows/backend.yml 顶部是同一个坑，同样留给 T-011 统一处理
# （通常是加一个总是运行的 merge-gate job）。
#
# ⚠️ 契约变更还会触发 backend.yml —— 那边的 paths 过滤里加了 `docs/api/**`，
# 因为契约测试（tests/Api/OpenApiDocumentTest 与 OpenApiContractHarnessTest）
# 住在 backend/ 下。只改契约不碰 backend/** 的 PR 必须同时跑到两条流水线，
# 否则契约与实现的漂移当场溜过去。
name: contract

on:
  pull_request:
    paths:
      - 'docs/api/**'
      - '.spectral.yaml'
      - '.spectral/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

jobs:
  spectral:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # node 版本与 commit-conventions.yml 保持一致。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # --fail-severity=warn 在 package.json 的 lint:api 里。
      # 刻意的：spectral:oas 里不少有价值的检查默认是 warning，而这个仓库只有
      # 一份契约，没有「先记个 warning 以后再说」的余地 —— warning 会一直在那儿，
      # 然后被下一个人当成背景噪音。
      - name: Spectral（§13.1 第 2 条）
        run: npm run lint:api
