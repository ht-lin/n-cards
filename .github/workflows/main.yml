# §14.3 的 main 合入流水线。T-011 交付。
#
#   全量 PR 检查（backend / android / android-release / shared，无 paths 过滤）
#     ├─► instrumentation  Gradle Managed Device，api 26 + api 34
#     ├─► backend-image    构建镜像推 GHCR（tag: sha + main）
#     └─► （AAB 由 android-release 带 bundle: true 一并产出）
#
# **本次没有做、留给后续任务的两段**（§14.3 里还有，但依赖的东西不在）：
#   - 部署 staging → 迁移 → 冒烟测试：**T-012**。需要 infra/ansible/ 的 playbook
#     （目前只有 README）与部署 SSH key。接法见本文件末尾的注释块。
#   - AAB 上传 Play Internal Testing：**T-456**。需要正式签名密钥与 Play service
#     account，两样现在都不存在（release 变体连 signingConfig 都还没有）。
#
# 刻意**不**写成永远 skip 的空壳 job：Actions 界面上「跳过了」和「跑了但什么都没做」
# 分不开，而后者会让人以为部署已经接上了。
#
# ⚠️ 这里也跑一遍全量 PR 检查，不是多余的：PR 上带 paths 过滤，而 main 上要的是
# 「合进来之后整棵树仍然是绿的」。跨目录的相互影响（改契约影响 Android 生成代码之类）
# 只有全量跑才看得见。顺带：gradle/actions/setup-gradle 只在默认分支写缓存，
# 所以这一趟也是在给 PR 侧喂 Gradle 缓存。

name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

# 不取消进行中的运行：main 上每个 commit 的镜像都要推上去（tag 带 sha），
# 取消会在 GHCR 上留下空洞，而 T-012 的部署是按 sha 找镜像的。
concurrency:
  group: main-pipeline
  cancel-in-progress: false

jobs:
  backend:
    name: backend
    uses: ./.github/workflows/backend.yml

  android:
    name: android
    uses: ./.github/workflows/android.yml

  android-release:
    name: android-release
    uses: ./.github/workflows/android-release.yml
    with:
      # §14.3：main 合入流水线要「构建 Android AAB」。上传 Play 属 T-456。
      bundle: true

  shared:
    name: shared
    uses: ./.github/workflows/shared.yml

  # §13.3：关键路径的仪器测试在 Gradle Managed Device 上通过；§14.3 点名 api 26 + 34。
  #
  # 只在 main 上跑，不进 PR 流水线：两档模拟器启动 + 31 个测试远超 §14.3 的 12 分钟
  # 预算。代价是仪器测试的红会在合入之后才出现 —— 这是 §14.3 自己的编排，
  # 不是 T-011 的取舍。
  #
  # ⚠️ api 26 这一档是 T-011 第一次跑：T-009 的 31 个测试此前只在 api 34 上验过。
  # 设备矩阵与「为什么不能用 ATD 镜像」写在 build-logic 的 ManagedDevices.kt 里。
  #
  # 跑根任务而不是点名 :core:crypto / :core:database，是为了防静默漂移：
  # 下一个加 androidTest 的模块不需要记得回来改这里。没有 androidTest 的模块
  # 对应任务是 NO-SOURCE，不会启动模拟器。
  instrumentation:
    name: instrumentation
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      # ⚠️ **这一步不是优化，是 emulator 能不能启动的前提。**
      #
      # runner 镜像里 /dev/kvm 是 `crw-rw---- 1 root kvm`（0660），而 runner 用户不在
      # kvm 组里 —— 节点存在，但打不开。emulator 于是回落到无硬件加速，而
      # ManagedDevices.kt 里两档设备的 testedAbi 都是 x86_64，x86_64 没有 KVM 就直接拒跑：
      #
      #     AvdSnapshotHandler$EmulatorStartFailedException: Unable to start Android
      #     emulator for dev26_default_x86_64_Pixel_2. Error message from emulator
      #     process = [ERROR | x86_64 emulation currently requires hardware acceleration!]
      #
      # api 26 与 api 34 各重试 5 次全挂，收尾是 "Deleting unbootable snapshot"。
      # 顺带：同一段日志里的 `gpuChoiceBasedOnGpuOptions: Selected GPU option
      # 'auto-no-window' is not valid` 是 emulator 自恢复的噪音（下一句就 switching to
      # 'auto'），两档都有，**不是**死因，别被它带偏。
      - name: 放开 /dev/kvm 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ⚠️ 这里查的是**可读写**，不是存在性。
      #
      # 上一版写的是 `test -e /dev/kvm`，它在 T-011 的失败 run 里**通过了** —— 节点确实
      # 在，权限却不给开。守卫查错了维度，于是它放行，真正的报错拖到三分钟后的
      # api26Setup 才炸，而那条报错完全不提 KVM。-r/-w 才是 emulator 实际需要的东西。
      - name: 确认 KVM 可用
        run: |
          # `|| true` 是必须的：shell 是 `bash -e`，节点不存在时 ls 会直接把脚本带走，
          # 下面两句精心写的 ::error:: 一个都打不出来，只剩一句 ls 的德/英文 not found。
          ls -l /dev/kvm || true
          test -e /dev/kvm || { echo "::error::runner 上没有 /dev/kvm，GMD 跑不了"; exit 1; }
          { test -r /dev/kvm && test -w /dev/kvm; } || {
            echo "::error::/dev/kvm 存在但当前用户读写不了（见上面的 ls），上一步的 udev 规则没生效"
            exit 1
          }

      # ⚠️ **这一步不是优化，是这条 job 能不能跑完的前提。**
      #
      # T-011 首跑与重跑都在这里死了两次，症状极具迷惑性：job 红了，但**一行日志都没有**
      # （`gh run view --log` 报 "log not found"）。真正的原因只出现在 job 的 annotation 里：
      #
      #     System.IO.IOException: No space left on device :
      #       '/home/runner/actions-runner/.../Worker_*.log'
      #
      # 磁盘满到 runner 连自己的诊断日志都写不下，于是日志上传这一步也没了 ——
      # 「失败但没有日志」这个组合本身就是磁盘满的signature，下次见到先来看这里。
      #
      # 为什么偏偏是这条 job：它要下两个 system image（api 26 的 aosp 与 api 34 的
      # aosp-atd，合计约 2 GB）+ 建两个 AVD，还要为 30 个模块构建 androidTest APK。
      # 另外三条 job 都不碰模拟器，所以只有这里会撑爆。
      #
      # 删的四样都与本 job 无关，且是 runner 镜像里最大的几块（合计约 10 GB）。
      # ⚠️ **不要**删 /usr/local/lib/android —— 那是 $ANDROID_HOME，setup-android 用的就是它。
      # 也不要整个删 /opt/hostedtoolcache：setup-java 把 JDK 装在那下面。
      - name: 腾出磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL" || true
          echo "== 清理后 =="; df -h /

      - name: 仪器测试（GMD, api 26 + api 34）
        working-directory: android
        run: ./gradlew ncardsGroupDebugAndroidTest

      # 失败时磁盘余量是第一个要看的数字（见上面那段）。always() 是刻意的。
      - name: 磁盘余量（诊断用）
        if: always()
        run: df -h /

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-reports
          path: |
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: ignore

  # §14.3：「构建后端镜像 → 推 GHCR（tag: sha + main）」。
  # 镜像名不是随手起的 —— infra/compose/docker-compose.{staging,prod}.yml 里已经
  # 写死了 ghcr.io/ht-lin/n-cards-backend，T-012 的部署直接消费这个 tag。
  backend-image:
    name: backend-image
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # GITHUB_TOKEN 推 GHCR 需要这一条。写在 job 级而不是 workflow 级：
      # 其余 job 一个都不需要写权限。
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: '构建并推送（tag: sha + main）'
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          # backend/Dockerfile 有 dev / prod 两个 target，部署用的是 prod
          # （非 root、只读 rootfs，§14.2）。
          target: prod
          push: true
          tags: |
            ghcr.io/ht-lin/n-cards-backend:${{ github.sha }}
            ghcr.io/ht-lin/n-cards-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 留给 T-012（Hetzner staging + Ansible）
  #
  #   deploy-staging:
  #     needs: [backend-image, instrumentation]
  #     → Ansible over SSH 部署 ghcr.io/ht-lin/n-cards-backend:${{ github.sha }}
  #     → doctrine:migrations:migrate --no-interaction --allow-no-migration
  #     → 冒烟测试（curl /health/ready + 安全响应头，见 T-012 验收标准）
  #
  # 需要的 repository secrets（§14.3「密钥管理」）：部署 SSH key。
  # ⚠️ Vault unseal key **绝不**进 CI（§14.3 原文 / ADR-0004），staging 只用合成数据。
  #
  # 留给 T-456（Play 上架）
  #
  #   play-internal:
  #     needs: android-release
  #     → 下载 android-release artifact 里的 AAB → 上传 Play Internal Testing
  #
  # 需要：正式签名密钥（现在 release 变体连 signingConfig 都没有，见
  # NcardsAndroidApplicationPlugin）+ Play service account JSON。
  # ------------------------------------------------------------------
