# 手动部署 / 生产发布（§14.3「生产发布（手动触发 + approval）」）。T-012 交付。
#
# 一个文件承担两件事，是刻意的：
#
#   environment=production  §14.3 的生产发布流水线骨架 —— 选 sha → approval →
#                           前置快照 → 重启 → 迁移 → 健康检查 → 失败自动回滚
#   environment=staging     **不等 main 合入就能演练整条 CI 部署路径**。
#                           这是把 secrets、known_hosts、sops 解密、collection
#                           安装全验一遍的唯一办法，也是交付前排练的主力入口。
#
# 真正的流程在 deploy.yml（reusable）里，两个调用方共用同一份定义 ——
# 「生产走的是不是 staging 验过的那条路」这件事因此不需要靠人记得。
#
# ⚠️ 生产主机目前**不存在**（inventory/production.yml 是骨架）。
# 选 production 会在 DNS 解析那一步失败 —— 这是刻意的，比连上一台错的机器好。

name: deploy-manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '目标环境'
        type: choice
        options: [staging, production]
        default: staging
        required: true
      image_tag:
        description: '完整的 40 位 commit sha（GHCR 上必须已有这个 tag）'
        type: string
        required: true
      run_migrations:
        description: '执行 Doctrine 迁移'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # 先做三件便宜的校验，再去碰主机。
  # 把「tag 打错了」挡在 approval 之前 —— 让人点了同意才发现拉不到镜像，
  # 是最没必要的一种浪费。
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      site_url: ${{ steps.resolve.outputs.site_url }}
    steps:
      - name: 校验 sha 形态
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$IMAGE_TAG" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::image_tag 必须是完整的 40 位 commit sha，实得：$IMAGE_TAG"
            echo "短 sha 与分支名都不接受 —— main.yml 只按完整 sha 推 tag，"
            echo "别的写法会拉到一个和你以为的不同的镜像（或者 :main 这种会漂的 tag）。"
            exit 1
          fi

      - name: 确认镜像已存在于 GHCR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker manifest inspect "ghcr.io/ht-lin/n-cards-backend:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "::error::GHCR 上没有 ghcr.io/ht-lin/n-cards-backend:${IMAGE_TAG}"
            echo "确认那个 commit 的 main 流水线里 backend-image 这个 job 真的跑绿了。"
            exit 1
          fi
          echo "✓ 镜像存在"

      - name: 解析目标域名
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "site_url=https://api.n-cards.de" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://api.staging.n-cards.de" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guard
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
      site_url: ${{ needs.guard.outputs.site_url }}
      run_migrations: ${{ inputs.run_migrations }}
    # 显式传，不用 secrets: inherit —— inherit 会把仓库里**所有**的 secret
    # 都递给被调用的 workflow，包括将来才加的那些。
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
