# Android 质量门禁（§13.3）。由 T-008 交付的最小版本。
#
# T-011 会在此基础上补齐：Gradle Managed Device 上的 instrumentation 测试
# （api 26 + api 34）、`koverVerify` 覆盖率门禁、
# assembleRelease 与 APK 大小回归（≤ +500 KB），
# 并把 backend / android / shared 三条流水线并行编排。
#
# 「生成代码 diff」已由 T-010 落地（见下面的 checkApiClientUpToDate 一步）。
# T-011 把它并进 §14.3 的 shared 流水线时，注意它需要 JDK + Android SDK，
# 搬过去要连着环境一起搬。
#
# ⚠️ 本 workflow 带 paths 过滤，因此**不要**把它加进
# scripts/setup-branch-protection.sh 的 required_status_checks ——
# 不碰 android/** 的 PR 永远不会上报这个 context，配上
# strict_required_status_checks_policy 会把那类 PR 永久卡死。
# 与 backend.yml / contract.yml 顶部是同一个坑，同样留给 T-011 统一处理
# （通常是加一个总是运行的 merge-gate job）。
#
# ⚠️ 覆盖率门禁（§13.3：core:* 与 data:* 行覆盖 ≥ 70%）**阈值已经配好**
# （build-logic 的 Coverage.kt），但这里刻意不跑 `koverVerify`：
# 30 个模块里大部分仍是空壳，分母为 0，现在跑只会得到一个假绿，
# 然后在第一个真正写代码的任务里突然变红。由 T-011 在 T-009/T-010 之后打开。
#
# T-009 落地后多了一条**必须先决策**的：core:database 有意义的测试全在
# androidTest（SQLCipher 是 JNI，Robolectric 加载不了），而 Kover 默认只统计单测。
# 打开 koverVerify 前要选一个：把仪器测试的覆盖率并进来，还是给该模块记一条
# 有理由的豁免。详见 android/README.md 的「已知事项」。
#
# T-010 落地后 core:network:api **已经**记了一条豁免（Coverage.kt 的
# COVERAGE_EXEMPT）：整个模块是生成产物，为它写测试等于在测 openapi-generator。
# 那一条不需要 T-011 再做决定，core:database 那一条仍然需要。

name: android

on:
  pull_request:
    paths:
      - 'android/**'
      # ⚠️ 契约也要触发这条流水线（T-010 起）：core:network:api 是
      # docs/api/openapi.yaml 的生成产物，「改了契约却没重新生成」这条门禁
      # （checkApiClientUpToDate）只在这里跑。少了这一行，只改契约不碰 android/**
      # 的 PR 根本不会跑到它，验收标准就成了摆设。
      # backend.yml 出于同样的理由已经把 docs/api/** 加进了它的 paths。
      - 'docs/api/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  quality-gates:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 17：AGP 9.3.2 的 Gradle module metadata 声明 org.gradle.jvm.version = 17，
      # 且 build-logic 与全部模块都编到 JVM 17（见 AndroidCommon.kt 的 compileOptions）。
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 这一步同时提供 Gradle 的构建缓存与配置缓存的落盘。
      # wrapper 的 distributionSha256Sum 已经钉在 gradle-wrapper.properties 里，
      # 所以这里不需要额外校验分发包。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      # ① 规则表本身对不对（穷举正反例 + settings.gradle.kts 覆盖率断言）。
      #    放在最前面：它是毫秒级的，且失败原因最容易读。
      - name: 模块依赖规则单测（§12.3）
        run: ./gradlew -p build-logic test --no-daemon

      # ② 规则真的接在构建上（注入违规依赖，断言构建红）。
      #    ① 全绿但 ② 红 = 规则表是对的，但插件没被应用到某处 —— 两条缺一不可，
      #    理由见脚本头部。
      - name: 模块依赖规则自检（§12.3 / T-008 验收标准）
        run: tools/module-graph-selftest.sh

      - name: ktlint（§13.3：0）
        run: ./gradlew ktlintCheck

      - name: detekt（§13.3：0 weighted issues）
        run: ./gradlew detekt

      # 德语必须是默认资源目录（§11.1 / T-008 验收标准第三条）。
      # lint 的 MissingTranslation 只查「默认语言有、翻译没有」这一个方向，
      # 查不出「有人把德语挪进了 values-de/」—— 那正是这一步守的东西。
      - name: 德语为默认资源目录（§11.1）
        run: ./gradlew checkGermanIsDefaultLocale

      # ⚠️ Android Lint 的 HardcodedText 只查 **XML 布局属性**，而 §4.3 的选型是
      # 「全 Compose，无 XML 布局」—— 它对本项目是空转的（T-008 实测：往 MainActivity
      # 里塞一个 Text("hardcoded") 再跑 :app:lintDebug，结果是 BUILD SUCCESSFUL）。
      # 这一步补上 Compose 那一半，见 build-logic 的 ComposeHardcodedText.kt。
      - name: Compose 文案不得硬编码（§11.1）
        run: ./gradlew checkComposeHardcodedText

      # :app 的 lint 开了 checkDependencies = true，一遍覆盖全部依赖模块，
      # 比 30 个模块各跑一遍快得多。
      # HardcodedText / MissingTranslation / ContentDescription 在 android/lint.xml
      # 里提升为 error（§13.3）。
      - name: Android Lint（§13.3：0 error）
        run: ./gradlew :app:lintDebug

      # §13.1 第 4 条：core:network:api 是 openapi-generator 的产物，提交入库但
      # 禁止手改 —— CI 重新生成并 diff，不一致即失败（T-010 验收标准第 1 条）。
      #
      # 它重新跑一遍生成器（约 20 s），产物落 build/，不碰工作区；比对的是两棵目录树
      # 而不是 git diff，所以「工作区本来就脏」不会被误判成「产物过期」。
      # 失败信息会直接给出该跑哪条命令。
      - name: 生成代码与契约一致（§13.1 第 4 条）
        run: ./gradlew :core:network:api:checkApiClientUpToDate

      - name: 单元测试（§13.4）
        run: ./gradlew testDebugUnitTest

      - name: assembleDebug（T-008 验收标准）
        run: ./gradlew assembleDebug

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
