# Android 质量门禁（§13.3）。由 T-008 交付最小版本，T-011 补齐并改成 reusable workflow。
#
# T-011 在这里加了 `koverVerify`（覆盖率门禁），并把本文件改成只能被调用 ——
# 触发编排搬到了 pr.yml 与 main.yml。另外两件由 T-011 交付但**不在本文件**：
#   - assembleRelease + APK 大小回归 → pr.yml 的 android-release job（独立并行，
#     R8 要一分多钟，串在本 job 后面会顶破 §14.3 的 12 分钟预算）
#   - Gradle Managed Device 上的仪器测试（api 26 + 34）→ main.yml
#     （§14.3 把它放在「main 合入流水线」，PR 上跑模拟器同样是预算问题）
#
# ⚠️ **不要**把 `android` 加进 scripts/setup-branch-protection.sh 的
# required_status_checks。这条 job 是有条件运行的（pr.yml 的 changes 过滤器决定），
# 不碰 android/** 的 PR 永远不会上报这个 context，配上
# strict_required_status_checks_policy 会把那类 PR 永久卡死。
# 唯一的 required check 是 pr.yml 的 `pr-gate`。推理见 docs/adr/0008-ci-gate-topology.md。
#
# ⚠️ 触发条件（原来的 paths 过滤）现在住在 pr.yml 的 `changes` job 里。其中
# `docs/api/**` 那一条的理由必须跟着一起搬：core:network:api 是 openapi.yaml 的生成
# 产物，「改了契约却没重新生成」这条门禁（checkApiClientUpToDate）**只在这里跑**。
# 少了它，只改契约不碰 android/** 的 PR 根本跑不到，T-010 的验收标准就成了摆设。
#
# ⚠️ §14.3 把 `openapi-codegen-diff` 划给 `shared` 流水线，实际留在了这里 ——
# 它要 JDK 17 + Android SDK + Gradle，搬去 shared 等于在关键路径上再装一遍
# Android SDK，而两条 job 都挂在同一个 pr-gate 下，门禁效果完全相同。
# 记录在 docs/adr/0008-ci-gate-topology.md 与 docs/tasks/M0.md 的 T-011 段。

name: android

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  quality-gates:
    name: android
    runs-on: ubuntu-latest
    # §14.3 的 PR 流水线预算是 ≤ 12 分钟（三条并行），这条是最长的一路。
    # 20 分钟留出缓存未命中的余量；跑到超时说明该去看是什么变慢了，而不是调大它。
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # JDK 17：AGP 9.3.2 的 Gradle module metadata 声明 org.gradle.jvm.version = 17，
      # 且 build-logic 与全部模块都编到 JVM 17（见 AndroidCommon.kt 的 compileOptions）。
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ `packages` 必须显式写，别删回裸的 `uses:`。
      #
      # 不给的话吃 action 的默认值 `tools platform-tools`，而 `tools`（废弃已久的
      # Android SDK Tools）已被 Google 从 SDK 仓库撤下：cmdline-tools 16.0 的
      # sdkmanager 解析不到，打一句 `Warning: Failed to find package 'tools'` 然后
      # exit 1，整个 job 在 17 秒内死在这一步（2026-09-19，#55 / #56 上的 main）。
      #
      # 这是外部变化而不是本仓库改坏的：2026-09-14 那趟同样的配置还是绿的，
      # 所以「上次还好好的」不构成把它改回去的理由。
      #
      # 只留 platform-tools（GMD 要 adb）；platform / build-tools 由 AGP 按
      # compileSdk 自己下，不需要在这里点名。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 这一步同时提供 Gradle 的构建缓存与配置缓存的落盘。
      # wrapper 的 distributionSha256Sum 已经钉在 gradle-wrapper.properties 里，
      # 所以这里不需要额外校验分发包。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false

      # ① 规则表本身对不对（穷举正反例 + settings.gradle.kts 覆盖率断言）。
      #    放在最前面：它是毫秒级的，且失败原因最容易读。
      - name: 模块依赖规则单测（§12.3）
        run: ./gradlew -p build-logic test --no-daemon

      # ② 规则真的接在构建上（注入违规依赖，断言构建红）。
      #    ① 全绿但 ② 红 = 规则表是对的，但插件没被应用到某处 —— 两条缺一不可，
      #    理由见脚本头部。
      - name: 模块依赖规则自检（§12.3 / T-008 验收标准）
        run: tools/module-graph-selftest.sh

      - name: ktlint（§13.3：0）
        run: ./gradlew ktlintCheck

      - name: detekt（§13.3：0 weighted issues）
        run: ./gradlew detekt

      # 德语必须是默认资源目录（§11.1 / T-008 验收标准第三条）。
      # lint 的 MissingTranslation 只查「默认语言有、翻译没有」这一个方向，
      # 查不出「有人把德语挪进了 values-de/」—— 那正是这一步守的东西。
      - name: 德语为默认资源目录（§11.1）
        run: ./gradlew checkGermanIsDefaultLocale

      # ⚠️ Android Lint 的 HardcodedText 只查 **XML 布局属性**，而 §4.3 的选型是
      # 「全 Compose，无 XML 布局」—— 它对本项目是空转的（T-008 实测：往 MainActivity
      # 里塞一个 Text("hardcoded") 再跑 :app:lintDebug，结果是 BUILD SUCCESSFUL）。
      # 这一步补上 Compose 那一半，见 build-logic 的 ComposeHardcodedText.kt。
      - name: Compose 文案不得硬编码（§11.1）
        run: ./gradlew checkComposeHardcodedText

      # :app 的 lint 开了 checkDependencies = true，一遍覆盖全部依赖模块，
      # 比 30 个模块各跑一遍快得多。
      # HardcodedText / MissingTranslation / ContentDescription 在 android/lint.xml
      # 里提升为 error（§13.3）。
      - name: Android Lint（§13.3：0 error）
        run: ./gradlew :app:lintDebug

      # §13.1 第 4 条：core:network:api 是 openapi-generator 的产物，提交入库但
      # 禁止手改 —— CI 重新生成并 diff，不一致即失败（T-010 验收标准第 1 条）。
      #
      # 它重新跑一遍生成器（约 20 s），产物落 build/，不碰工作区；比对的是两棵目录树
      # 而不是 git diff，所以「工作区本来就脏」不会被误判成「产物过期」。
      # 失败信息会直接给出该跑哪条命令。
      - name: 生成代码与契约一致（§13.1 第 4 条）
        run: ./gradlew :core:network:api:checkApiClientUpToDate

      - name: 单元测试（§13.4）
        run: ./gradlew testDebugUnitTest

      # §13.3：core:* 与 data:* 行覆盖 ≥ 70%。阈值、豁免与「生成代码不进分母」的
      # 过滤器都在 build-logic 的 Coverage.kt 里，那里有每一条的理由。
      #
      # T-011 打开它时纠正了 T-008 的一个判断：空壳模块**是**直接通过的，
      # 但有源码没单测的模块会红在 0.000000。四条豁免（network:api / database /
      # crypto / designsystem）都写了理由，加第五条前先读那段注释。
      - name: 覆盖率门禁（§13.3：core:* / data:* ≥ 70%）
        run: ./gradlew koverVerify

      - name: assembleDebug（T-008 验收标准）
        run: ./gradlew assembleDebug

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
